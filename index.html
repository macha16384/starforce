// ==========================================
// 1. ユーティリティ関数 ＆ 疑似乱数クラス (最優先定義)
// ==========================================
class PRNG {
  constructor(seed) {
    this.m = 0x80000000;
    this.a = 1103515245;
    this.c = 12345;
    this.state = seed ? seed : Math.floor(Math.random() * (this.m - 1));
  }
  nextInt() {
    this.state = (this.a * this.state + this.c) % this.m;
    return this.state;
  }
  nextFloat() {
    return this.nextInt() / (this.m - 1);
  }
}

function drawPoly(c, pts, fill, stroke) {
  if (!pts || pts.length < 3) return;
  c.save();
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) {
    c.lineTo(pts[i][0], pts[i][1]);
  }
  c.closePath();
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (stroke) {
    c.strokeStyle = stroke;
    c.lineWidth = 1;
    c.stroke();
  }
  c.restore();
}

function drawPolyDome(c, x, y, radius, sides, color) {
  c.save();
  c.translate(x, y);
  c.beginPath();
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    let px = Math.cos(a) * radius;
    let py = Math.sin(a) * radius;
    if (i === 0) c.moveTo(px, py);
    else c.lineTo(px, py);
  }
  c.closePath();
  let g = c.createRadialGradient(-radius * 0.3, -radius * 0.3, radius * 0.1, 0, 0, radius);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.5, color);
  g.addColorStop(1, '#000000');
  c.fillStyle = g;
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.6)';
  c.lineWidth = 1;
  c.stroke();
  c.restore();
}

function drawBevel(c, x, y, w, h, baseColor) {
  c.save();
  c.fillStyle = baseColor;
  c.fillRect(x, y, w, h);
  c.fillStyle = 'rgba(255,255,255,0.3)';
  c.fillRect(x, y, w, 2);
  c.fillRect(x, y, 2, h);
  c.fillStyle = 'rgba(0,0,0,0.5)';
  c.fillRect(x, y + h - 2, w, 2);
  c.fillRect(x + w - 2, y, 2, h);
  c.restore();
}

function drawDetailedEnemyShape(c, shape, color, w, h) {
  c.save();
  c.translate(w / 2, h / 2);
  let r = w / 2;
  if (shape === 'delta') {
    drawPoly(c, [[0, -r], [r, r], [0, r * 0.5], [-r, r]], color, '#ffffff');
  } else if (shape === 'stealth') {
    drawPoly(c, [[0, -r], [r, 0], [0, r], [-r, 0]], color, '#ffffff');
  } else if (shape === 'heavy') {
    drawPoly(c, [[-r * 0.8, -r], [r * 0.8, -r], [r, r], [-r, r]], color, '#ffffff');
  } else if (shape === 'cruiser') {
    drawPoly(c, [[0, -r], [r * 0.6, -r * 0.2], [r, r], [0, r * 0.6], [-r, r], [-r * 0.6, -r * 0.2]], color, '#ffffff');
  } else if (shape === 'mine') {
    drawPolyDome(c, 0, 0, r * 0.8, 8, color);
  } else if (shape === 'crescent') {
    drawPoly(c, [[0, -r], [r, 0], [r * 0.5, r], [0, r * 0.3], [-r * 0.5, r], [-r, 0]], color, '#ffffff');
  } else if (shape === 'saucer') {
    drawPolyDome(c, 0, 0, r, 12, color);
  } else if (shape === 'arrow') {
    drawPoly(c, [[0, -r], [r * 0.7, r * 0.3], [r * 0.3, r], [0, r * 0.6], [-r * 0.3, r], [-r * 0.7, r * 0.3]], color, '#ffffff');
  } else if (shape === 'star') {
    drawPoly(c, [[0, -r], [r * 0.3, -r * 0.3], [r, 0], [r * 0.3, r * 0.3], [0, r], [-r * 0.3, r * 0.3], [-r, 0], [-r * 0.3, -r * 0.3]], color, '#ffffff');
  } else if (shape === 'carrier') {
    drawBevel(c, -r, -r, w, h, color);
  } else {
    drawPoly(c, [[0, -r], [r, r], [-r, r]], color, '#ffffff');
  }
  c.restore();
}

// ★ スーパーソニック（SUPER SONIC）擬似3D描画関数
function draw2D3DStyleSuperSonic(c, w, h) {
  c.save();
  c.translate(w / 2, h / 2);

  let rX = w * 0.32;
  let rY = h * 0.48;

  c.save();
  c.beginPath();
  c.moveTo(0, -rY);
  c.bezierCurveTo(rX * 1.3, -rY * 0.4, rX * 1.3, rY * 0.4, 0, rY);
  c.bezierCurveTo(-rX * 1.3, rY * 0.4, -rX * 1.3, -rY * 0.4, 0, -rY);
  c.closePath();

  let bodyGrad = c.createRadialGradient(-rX * 0.3, -rY * 0.3, rX * 0.1, 0, 0, rY);
  bodyGrad.addColorStop(0, '#ffffff');
  bodyGrad.addColorStop(0.35, '#e0e8f0');
  bodyGrad.addColorStop(0.75, '#8a99a6');
  bodyGrad.addColorStop(1, '#3a4550');

  c.fillStyle = bodyGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  c.lineWidth = 1.2;
  c.stroke();
  c.restore();

  let ringR = rX * 0.65;
  c.save();
  c.beginPath();
  c.arc(0, 0, ringR, 0, Math.PI * 2);
  c.fillStyle = '#222a33';
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  c.lineWidth = 1;
  c.stroke();
  c.restore();

  let coreR = ringR * 0.75;
  c.save();
  c.beginPath();
  c.arc(0, 0, coreR, 0, Math.PI * 2);

  let coreGrad = c.createRadialGradient(-coreR * 0.35, -coreR * 0.35, coreR * 0.1, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.25, '#ffcc00');
  coreGrad.addColorStop(0.65, '#ff5500');
  coreGrad.addColorStop(0.9, '#aa1100');
  coreGrad.addColorStop(1, '#440000');

  c.shadowBlur = 15;
  c.shadowColor = '#ff6600';

  c.fillStyle = coreGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 220, 180, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.22, 0, Math.PI * 2);
  c.fill();

  c.restore();
  c.restore();
}

// ★ ガイラ（GUILER）擬似3D描画関数
function draw2D3DStyleGuiler(c, w, h) {
  c.save();
  c.translate(w / 2, h / 2);

  let r = w / 2;

  c.save();
  c.beginPath();
  c.moveTo(-r * 0.18, -r * 0.95);
  c.bezierCurveTo(-r * 0.6, -r * 0.95, -r * 0.95, -r * 0.4, -r * 0.95, r * 0.3);
  c.lineTo(-r * 0.65, r * 0.95);
  c.lineTo(-r * 0.25, r * 0.95);
  c.lineTo(-r * 0.25, -r * 0.2);
  c.bezierCurveTo(-r * 0.5, -r * 0.2, -r * 0.55, -r * 0.6, -r * 0.18, -r * 0.7);
  c.closePath();

  c.moveTo(r * 0.18, -r * 0.95);
  c.bezierCurveTo(r * 0.6, -r * 0.95, r * 0.95, -r * 0.4, r * 0.95, r * 0.3);
  c.lineTo(r * 0.65, r * 0.95);
  c.lineTo(r * 0.25, r * 0.95);
  c.lineTo(r * 0.25, -r * 0.2);
  c.bezierCurveTo(r * 0.5, -r * 0.2, r * 0.55, -r * 0.6, r * 0.18, -r * 0.7);
  c.closePath();

  let shellGrad = c.createRadialGradient(0, -r * 0.2, r * 0.1, 0, 0, r);
  shellGrad.addColorStop(0, '#ffffff');
  shellGrad.addColorStop(0.3, '#ff33aa');
  shellGrad.addColorStop(0.7, '#880066');
  shellGrad.addColorStop(1, '#220022');

  c.shadowBlur = 20;
  c.shadowColor = '#ff00aa';
  c.fillStyle = shellGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 200, 255, 0.8)';
  c.lineWidth = 1.5;
  c.stroke();
  c.restore();

  c.save();
  c.fillStyle = '#0a0d14';
  c.fillRect(-r * 0.2, -r * 0.85, r * 0.4, r * 1.75);
  c.strokeStyle = '#ff00aa';
  c.lineWidth = 1;
  c.strokeRect(-r * 0.2, -r * 0.85, r * 0.4, r * 1.75);

  c.fillStyle = '#ffaa00';
  c.fillRect(-r * 0.12, -r * 0.8, r * 0.04, r * 1.6);
  c.fillRect(r * 0.08, -r * 0.8, r * 0.04, r * 1.6);
  c.restore();

  c.save();
  c.beginPath();
  c.moveTo(-r * 0.45, r * 0.9);
  c.lineTo(-r * 0.45, r * 0.2);
  c.bezierCurveTo(-r * 0.45, -r * 0.3, r * 0.45, -r * 0.3, r * 0.45, r * 0.2);
  c.lineTo(r * 0.45, r * 0.9);
  c.lineTo(-r * 0.45, r * 0.9);
  c.closePath();

  let mainGrad = c.createLinearGradient(0, -r * 0.3, 0, r * 0.9);
  mainGrad.addColorStop(0, '#ffffff');
  mainGrad.addColorStop(0.4, '#e0e8f0');
  mainGrad.addColorStop(0.8, '#607080');
  mainGrad.addColorStop(1, '#202835');

  c.shadowBlur = 10;
  c.shadowColor = '#00ffff';
  c.fillStyle = mainGrad;
  c.fill();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 1.2;
  c.stroke();
  c.restore();

  c.save();
  c.beginPath();
  c.moveTo(0, -r * 0.65);
  c.lineTo(r * 0.15, -r * 0.35);
  c.lineTo(r * 0.15, r * 0.1);
  c.lineTo(-r * 0.15, r * 0.1);
  c.lineTo(-r * 0.15, -r * 0.35);
  c.closePath();

  let noseGrad = c.createLinearGradient(-r * 0.15, 0, r * 0.15, 0);
  noseGrad.addColorStop(0, '#ffffff');
  noseGrad.addColorStop(0.5, '#d0e5ff');
  noseGrad.addColorStop(1, '#506580');

  c.fillStyle = noseGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.beginPath();
  c.arc(0, -r * 0.45, r * 0.06, 0, Math.PI * 2);
  c.fillStyle = '#00ffff';
  c.shadowBlur = 12;
  c.shadowColor = '#00ffff';
  c.fill();
  c.restore();

  c.save();
  let panelW = r * 0.5;
  let panelH = r * 0.55;
  let panelY = r * 0.25;

  c.fillStyle = '#151c28';
  c.fillRect(-panelW / 2, panelY, panelW, panelH);
  c.strokeStyle = 'rgba(0, 255, 255, 0.6)';
  c.lineWidth = 1;
  c.strokeRect(-panelW / 2, panelY, panelW, panelH);

  c.fillStyle = '#ff3366';
  for (let i = 0; i < 3; i++) {
    c.fillRect(-panelW * 0.35, panelY + r * 0.1 + i * (r * 0.14), panelW * 0.7, r * 0.05);
  }

  c.restore();
  c.restore();
}

// ★ ラリオス（LARIOS）新パーツ・全体回転合体描画関数
function draw2D3DStyleLariosParts(c, x, y, partsOffset, assembled, rotAngle) {
  c.save();
  c.translate(x, y);

  const po = partsOffset;
  const cCore = assembled ? '#ff0055' : '#ffff00';

  c.rotate(rotAngle);

  c.save();
  c.shadowBlur = 20;
  c.shadowColor = cCore;

  c.beginPath();
  c.arc(0, 0, 16, 0, Math.PI * 2);
  c.fillStyle = '#101520';
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.6)';
  c.lineWidth = 1;
  c.stroke();

  let coreGrad = c.createRadialGradient(-4, -4, 2, 0, 0, 12);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, cCore);
  coreGrad.addColorStop(1, '#440011');
  c.beginPath();
  c.arc(0, 0, 12, 0, Math.PI * 2);
  c.fillStyle = coreGrad;
  c.fill();
  c.restore();

  const drawPartGeometry = () => {
    c.beginPath();
    c.moveTo(-3, -3);
    c.lineTo(-24, -3);
    c.lineTo(-32, -11);
    c.lineTo(-32, -24);
    c.lineTo(-24, -32);
    c.lineTo(-11, -32);
    c.lineTo(-3, -24);
    c.closePath();

    let pGrad = c.createLinearGradient(-32, -32, 0, 0);
    pGrad.addColorStop(0, '#ffffff');
    pGrad.addColorStop(0.3, '#d0dae5');
    pGrad.addColorStop(0.7, '#708090');
    pGrad.addColorStop(1, '#25303b');

    c.fillStyle = pGrad;
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    c.lineWidth = 1.2;
    c.stroke();

    c.beginPath();
    c.moveTo(-6, -6);
    c.lineTo(-20, -6);
    c.lineTo(-26, -12);
    c.lineTo(-26, -20);
    c.lineTo(-12, -26);
    c.lineTo(-6, -20);
    c.closePath();
    c.fillStyle = 'rgba(0, 0, 0, 0.25)';
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    c.lineWidth = 1;
    c.stroke();
  };

  const angles = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
  angles.forEach((rot) => {
    c.save();
    c.rotate(rot);
    c.translate(-po, -po);
    drawPartGeometry();
    c.restore();
  });

  c.restore();
}

function draw3DGalli(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let cameraDist = 350;
  let rotX = 0.4;
  let rotY = rotYAnim || 0;

  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let transformed = GALLI_3D_MESH.vertices.map(v => {
    let x1 = v.x * cosY + v.z * sinY;
    let z1 = -v.x * sinY + v.z * cosY;
    let y2 = v.y * cosX - z1 * sinX;
    let z2 = v.y * sinX + z1 * cosX;
    let perspective = cameraDist / (cameraDist + z2 + 100);
    return { x: x1 * scale * perspective, y: y2 * scale * perspective, z: z2 };
  });

  let renderFaces = GALLI_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    let v0 = pts[0], v1 = pts[1], v2 = pts[2];
    let nx = (v1.y - v0.y) * (v2.z - v0.z) - (v1.z - v0.z) * (v2.y - v0.y);
    let ny = (v1.z - v0.z) * (v2.x - v0.x) - (v1.x - v0.x) * (v2.z - v0.z);
    let nz = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);
    return { pts, color: f.c, z: avgZ, isFront: nz > 0 };
  });

  renderFaces.sort((a, b) => b.z - a.z);

  renderFaces.forEach(f => {
    if (!f.isFront) return;
    c.beginPath(); c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath(); c.fillStyle = f.color; c.fill();
    c.strokeStyle = "rgba(255, 255, 255, 0.25)"; c.lineWidth = 0.8; c.stroke();
  });
  c.restore();
}
// ★ エトリ（ETTORI）3Dデータ ＆ 描画関数
function createLightEttori3DMesh() {
  let vertices = [];
  let faces = [];

  const sides = 8;
  const rFlat = 5;
  const rMid = 13;
  const rInner = 9;

  const yTop = -14;
  const yUpperMid = -5;
  const yLowerMid = 5;
  const yBot = 14;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rFlat, y: yTop, z: Math.sin(a) * rFlat });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rMid, y: yUpperMid, z: Math.sin(a) * rMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rInner, y: yUpperMid + 1.5, z: Math.sin(a) * rInner });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rInner, y: yLowerMid - 1.5, z: Math.sin(a) * rInner });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rMid, y: yLowerMid, z: Math.sin(a) * rMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rFlat, y: yBot, z: Math.sin(a) * rFlat });
  }

  faces.push({ v: [0, 1, 2, 3, 4, 5, 6, 7], c: '#f0d0ff' });

  for (let i = 0; i < sides; i++) {
    let t1 = i, t2 = (i + 1) % sides;
    let m1 = i + 8, m2 = (i + 1) % sides + 8;
    faces.push({ v: [t1, m1, m2, t2], c: (i % 2 === 0) ? '#d880ff' : '#a040e0' });
  }
  for (let i = 0; i < sides; i++) {
    let m1 = i + 8, m2 = (i + 1) % sides + 8;
    let in1 = i + 16, in2 = (i + 1) % sides + 16;
    faces.push({ v: [m1, in1, in2, m2], c: (i % 2 === 0) ? '#7722aa' : '#551188' });
  }
  for (let i = 0; i < sides; i++) {
    let in1 = i + 16, in2 = (i + 1) % sides + 16;
    let in3 = (i + 1) % sides + 24, in4 = i + 24;
    faces.push({ v: [in1, in4, in3, in2], c: (i % 2 === 0) ? '#220033' : '#330055' });
  }
  for (let i = 0; i < sides; i++) {
    let in4 = i + 24, in3 = (i + 1) % sides + 24;
    let lm1 = i + 32, lm2 = (i + 1) % sides + 32;
    faces.push({ v: [in4, lm1, lm2, in3], c: (i % 2 === 0) ? '#551188' : '#330066' });
  }
  for (let i = 0; i < sides; i++) {
    let lm1 = i + 32, lm2 = (i + 1) % sides + 32;
    let b1 = i + 40, b2 = (i + 1) % sides + 40;
    faces.push({ v: [lm1, b1, b2, lm2], c: (i % 2 === 0) ? '#8833bb' : '#662299' });
  }
  faces.push({ v: [47, 46, 45, 44, 43, 42, 41, 40], c: '#330044' });

  return { vertices, faces };
}

const ETTORI_3D_MESH = createLightEttori3DMesh();

function draw3DEttori(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = ETTORI_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = [];
  for (let f of ETTORI_3D_MESH.faces) {
    let pts = f.v.map(idx => transformed[idx]);
    let v0 = pts[0], v1 = pts[1], v2 = pts[2];
    let crossZ = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);

    if (crossZ >= 0) {
      let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
      renderFaces.push({ pts, color: f.c, z: avgZ });
    }
  }

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    c.strokeStyle = "rgba(255, 200, 255, 0.4)";
    c.lineWidth = 0.8;
    c.stroke();
  });
  c.restore();
}

// ★ スルタン（SULTAN）3Dデータ ＆ 描画関数
function createExactDotSultanMesh() {
  let vertices = [];
  let faces = [];

  const zBase = 0.0;
  const zMid = 3.0;
  const zTop = 6.0;

  function addV(x, y, z) {
    vertices.push({ x, y, z });
    return vertices.length - 1;
  }

  let vT_L = addV( -8, -14, zMid);
  let vT_R = addV(  8, -14, zMid);
  let vM_L = addV(-16,  -8, zMid);
  let vM_R = addV( 16,  -8, zMid);
  let vB_L = addV(-16,  10, zMid);
  let vB_R = addV( 16,  10, zMid);
  let vC_L = addV( -9,  17, zMid);
  let vC_R = addV(  9,  17, zMid);

  faces.push({
    v: [vT_L, vT_R, vM_R, vB_R, vC_R, vC_L, vB_L, vM_L],
    color: '#ffffff', stroke: '#ff6699', zOffset: 0
  });

  faces.push({ v: [vT_L, vM_L, vB_L, vC_L], color: '#f0d0e0', stroke: 'none', zOffset: 0.5 });
  faces.push({ v: [vT_R, vM_R, vB_R, vC_R], color: '#e0b0c0', stroke: 'none', zOffset: 0.5 });

  let vN_TL = addV(-4, -20, zTop);
  let vN_TR = addV( 4, -20, zTop);
  let vN_BL = addV(-4, -10, zTop);
  let vN_BR = addV( 4, -10, zTop);

  faces.push({ v: [vN_TL, vN_TR, vN_BR, vN_BL], color: '#ffffff', stroke: '#000000', zOffset: 3 });

  faces.push({ v: [vN_TL, vN_BL, vT_L], color: '#777777', stroke: '#000000', zOffset: 2 });
  faces.push({ v: [vN_TR, vN_BR, vT_R], color: '#555555', stroke: '#000000', zOffset: 2 });

  const slotW = 1.6;
  const slotY1 = -9;
  const slotY2 = 3;

  [-5.5, 0, 5.5].forEach(xOff => {
    let sTL = addV(xOff - slotW, slotY1, zBase);
    let sTR = addV(xOff + slotW, slotY1, zBase);
    let sBR = addV(xOff + slotW, slotY2, zBase);
    let sBL = addV(xOff - slotW, slotY2, zBase);
    faces.push({ v: [sTL, sTR, sBR, sBL], color: '#000000', stroke: 'none', zOffset: 4 });
  });

  let hTL = addV(-7.5, 1, zBase);
  let hTR = addV( 7.5, 1, zBase);
  let hBR = addV( 7.5, 4, zBase);
  let hBL = addV(-7.5, 4, zBase);
  faces.push({ v: [hTL, hTR, hBR, hBL], color: '#000000', stroke: 'none', zOffset: 4 });

  [-5.5, 0, 5.5].forEach(xOff => {
    let kTL = addV(xOff - 1.8,  6, zBase);
    let kTR = addV(xOff + 1.8,  6, zBase);
    let kBR = addV(xOff + 1.8, 11, zBase);
    let kBL = addV(xOff - 1.8, 11, zBase);
    faces.push({ v: [kTL, kTR, kBR, kBL], color: '#000000', stroke: 'none', zOffset: 4 });
  });

  let cL1 = addV(-14,  9, zTop);
  let cL2 = addV(-11, 13, zTop);
  let cL3 = addV(-10, 12, zTop);
  let cL4 = addV(-13,  8, zTop);
  faces.push({ v: [cL1, cL2, cL3, cL4], color: '#000000', stroke: 'none', zOffset: 5 });

  let cR1 = addV( 14,  9, zTop);
  let cR2 = addV( 11, 13, zTop);
  let cR3 = addV( 10, 12, zTop);
  let cR4 = addV( 13,  8, zTop);
  faces.push({ v: [cR1, cR2, cR3, cR4], color: '#000000', stroke: 'none', zOffset: 5 });

  return { vertices, faces };
}

const SULTAN_3D_MESH = createExactDotSultanMesh();

function draw3DSultan(c, w, h, baseColor) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 38.0;

  let transformed = SULTAN_3D_MESH.vertices.map(v => {
    return { x: v.x * scale, y: v.y * scale, z: v.z };
  });

  let renderFaces = SULTAN_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length + (f.zOffset || 0);
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke && f.stroke !== 'none') {
      c.strokeStyle = f.stroke;
      c.lineWidth = 1.0;
      c.stroke();
    }
  });
  c.restore();
}

// ★ ガドーハ（GADOHA）グリーン3Dデータ ＆ 描画関数
function createGreenGadoha3DMesh() {
  let vertices = [];
  let faces = [];

  const sides = 16;
  const zOuter = 2.0;
  const zArm   = 4.0;
  const zCore  = 7.0;

  function addV(x, y, z) {
    vertices.push({ x, y, z });
    return vertices.length - 1;
  }

  const rOuterIn = 10.5;
  const rOuterOut = 18.0;

  let outerInV = [], outerOutV = [];
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    outerInV.push(addV(Math.cos(a) * rOuterIn, Math.sin(a) * rOuterIn, zOuter));
    outerOutV.push(addV(Math.cos(a) * rOuterOut, Math.sin(a) * rOuterOut, zOuter));
  }

  for (let i = 0; i < sides; i++) {
    let i1 = outerInV[i], i2 = outerInV[(i + 1) % sides];
    let o1 = outerOutV[i], o2 = outerOutV[(i + 1) % sides];
    let c = (i % 2 === 0) ? '#66e6b3' : '#33cc99';
    faces.push({ v: [i1, i2, o2, o1], color: c, stroke: '#ffffff', zOffset: 1 });
  }

  const armWidth = 2.4;
  for (let k = 0; k < 3; k++) {
    let angle = (k * Math.PI * 2) / 3 - Math.PI / 2;
    let cosA = Math.cos(angle), sinA = Math.sin(angle);
    let perpX = -sinA * armWidth, perpY = cosA * armWidth;

    let a1 = addV(perpX, perpY, zArm);
    let a2 = addV(-perpX, -perpY, zArm);
    let a3 = addV(cosA * rOuterIn - perpX, sinA * rOuterIn - perpY, zArm);
    let a4 = addV(cosA * rOuterIn + perpX, sinA * rOuterIn + perpY, zArm);

    faces.push({ v: [a1, a2, a3, a4], color: '#1a6647', stroke: '#99ffe6', zOffset: 2 });
  }

  const rCore = 6.5;
  let coreV = [];
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    coreV.push(addV(Math.cos(a) * rCore, Math.sin(a) * rCore, zCore));
  }

  faces.push({ v: coreV, color: '#e6ffff', stroke: '#33cc99', zOffset: 4 });

  for (let i = 0; i < sides; i++) {
    let c1 = coreV[i], c2 = coreV[(i + 1) % sides];
    let a1 = (i * Math.PI * 2) / sides, a2 = ((i + 1) * Math.PI * 2) / sides;
    let b1 = addV(Math.cos(a1) * (rCore + 1.2), Math.sin(a1) * (rCore + 1.2), zArm);
    let b2 = addV(Math.cos(a2) * (rCore + 1.2), Math.sin(a2) * (rCore + 1.2), zArm);

    let shadowCol = (i % 2 === 0) ? '#269970' : '#1d8059';
    faces.push({ v: [c1, c2, b2, b1], color: shadowCol, stroke: 'none', zOffset: 3 });
  }

  const rCenter = 3.0;
  let centerV = [];
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    centerV.push(addV(Math.cos(a) * rCenter, Math.sin(a) * rCenter, zCore + 0.5));
  }
  faces.push({ v: centerV, color: '#ccff33', stroke: '#ffffff', zOffset: 5 });

  return { vertices, faces };
}

const GADOHA_3D_MESH = createGreenGadoha3DMesh();

function draw3DGadoha(c, w, h, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);

  let cosZ = Math.cos(rotZAnim);

    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = GADOHA_3D_MESH.faces.map(f => {

    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length + (f.zOffset || 0);
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);

}

// ★ アマラ（AMARA）3Dデータ ＆ 描画関数
function createCompleteAmara3DMesh() {
  let vertices = [];
  let faces = [];

  function addV(x, y, z) {
    vertices.push({ x, y, z });
    return vertices.length - 1;
  }

  function addBox(x, y, z, w, h, d, colorFront, colorSide, colorTop) {
    let hw = w / 2, hh = h / 2, hd = d / 2;

    let v0 = addV(x - hw, y - hh, z - hd);
    let v1 = addV(x + hw, y - hh, z - hd);
    let v2 = addV(x + hw, y + hh, z - hd);
    let v3 = addV(x - hw, y + hh, z - hd);

    let v4 = addV(x - hw, y - hh, z + hd);
    let v5 = addV(x + hw, y - hh, z + hd);
    let v6 = addV(x + hw, y + hh, z + hd);
    let v7 = addV(x - hw, y + hh, z + hd);

    faces.push({ v: [v0, v1, v2, v3], c: colorFront });
    faces.push({ v: [v5, v4, v7, v6], c: colorFront });
    faces.push({ v: [v4, v0, v3, v7], c: colorSide });
    faces.push({ v: [v1, v5, v6, v2], c: colorSide });
    faces.push({ v: [v4, v5, v1, v0], c: colorTop });
    faces.push({ v: [v3, v2, v6, v7], c: colorTop });
  }

  addBox(-12, 0, 0, 4, 26, 8, '#ff3333', '#cc0000', '#ff6666');
  addBox( 12, 0, 0, 4, 26, 8, '#ff3333', '#990000', '#ff6666');

  addBox(-7.5, 0, 0, 3, 22, 6, '#e60000', '#aa0000', '#ff4d4d');
  addBox( 7.5, 0, 0, 3, 22, 6, '#e60000', '#880000', '#ff4d4d');

  const sides = 12;
  const rCore = 3.5;
  const length = 12;
  let coreV1 = [], coreV2 = [];

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    let cy = Math.cos(a) * rCore;
    let cz = Math.sin(a) * rCore;
    coreV1.push(addV(-length / 2, cy, cz));
    coreV2.push(addV( length / 2, cy, cz));
  }

  for (let i = 0; i < sides; i++) {
    let i1 = i, i2 = (i + 1) % sides;
    let c = (i % 2 === 0) ? '#ffffff' : '#cccccc';
    faces.push({ v: [coreV1[i1], coreV2[i1], coreV2[i2], coreV1[i2]], c: c });
  }

  addBox(0, 0, 0, 5, 8, 5, '#ffffff', '#aaaaaa', '#ffffff');
  addBox(0, 0, 4, 3, 4, 3, '#ffff00', '#cccc00', '#ffff80');
  addBox(0, 0, -4, 3, 4, 3, '#ffff00', '#999900', '#ffff80');

  return { vertices, faces };
}

const AMARA_3D_MESH = createCompleteAmara3DMesh();

function draw3DAmara(c, w, h, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 34.0;
  let cameraDist = 350;
  let rotX = 0.45;
  let rotY = rotYAnim || 0;

  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let transformed = AMARA_3D_MESH.vertices.map(v => {
    let x1 = v.x * cosY + v.z * sinY;
    let z1 = -v.x * sinY + v.z * cosY;
    let y2 = v.y * cosX - z1 * sinX;
    let z2 = v.y * sinX + z1 * cosX;
    let perspective = cameraDist / (cameraDist + z2 + 100);
    return { x: x1 * scale * perspective, y: y2 * scale * perspective, z: z2 };
  });

  let renderFaces = AMARA_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    
    let v0 = pts[0], v1 = pts[1], v2 = pts[2];
    let nx = (v1.y - v0.y) * (v2.z - v0.z) - (v1.z - v0.z) * (v2.y - v0.y);
    let ny = (v1.z - v0.z) * (v2.x - v0.x) - (v1.x - v0.x) * (v2.z - v0.z);
    let nz = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);

    return { pts, color: f.c, z: avgZ, isFront: nz > 0 };
  });

  renderFaces.sort((a, b) => b.z - a.z);

  renderFaces.forEach(f => {
    if (!f.isFront) return;
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    c.strokeStyle = "rgba(255, 220, 220, 0.4)";
    c.lineWidth = 0.8;
    c.stroke();
  });
  c.restore();
}

// ★ トッパー（TOPPER）擬似3D描画関数（シルバー＆レッドコア）
function draw3DTopper(c, w, h) {
  c.save();
  c.translate(w / 2, h / 2);
  let r = w * 0.45;

  function getOctagonPt(rad) {
    let pts = [];
    for (let i = 0; i < 8; i++) {
      let angle = (i * Math.PI / 4) - Math.PI / 8;
      pts.push({ x: Math.cos(angle) * rad, y: Math.sin(angle) * rad });
    }
    return pts;
  }

  // A. 正八角形外枠 (シルバーグラデーション)
  let outerPts = getOctagonPt(r);
  c.beginPath();
  c.moveTo(outerPts[0].x, outerPts[0].y);
  for (let i = 1; i < 8; i++) c.lineTo(outerPts[i].x, outerPts[i].y);
  c.closePath();
  
  let baseGrad = c.createRadialGradient(-r*0.2, -r*0.2, r*0.1, 0, 0, r);
  baseGrad.addColorStop(0, '#ffffff');
  baseGrad.addColorStop(0.4, '#cccccc');
  baseGrad.addColorStop(0.8, '#8899a6');
  baseGrad.addColorStop(1, '#445566');
  c.fillStyle = baseGrad;
  c.fill();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 1.5;
  c.stroke();

  // B. 多角層リングパネル
  let ringRadii = [r * 0.85, r * 0.65, r * 0.45];
  for (let k = 0; k < ringRadii.length; k++) {
    let rCurr = ringRadii[k];
    let pts = getOctagonPt(rCurr);
    
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 8; i++) c.lineTo(pts[i].x, pts[i].y);
    c.closePath();
    
    let alpha = 0.25 + k * 0.15;
    c.fillStyle = (k % 2 === 0) ? `rgba(255, 255, 255, ${alpha})` : `rgba(30, 40, 50, ${alpha})`;
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    c.lineWidth = 1.0;
    c.stroke();
  }

  // C. 斜め4方向アーム
  let rCoreEdge = r * 0.25;
  for (let i = 0; i < 4; i++) {
    let aCenter = (i * Math.PI / 2) + Math.PI / 4;
    let spread = Math.PI / 12;

    let a1 = aCenter - spread;
    let a2 = aCenter + spread;

    c.beginPath();
    c.moveTo(Math.cos(a1) * rCoreEdge, Math.sin(a1) * rCoreEdge);
    c.lineTo(Math.cos(a1) * r * 0.98, Math.sin(a1) * r * 0.98);
    c.lineTo(Math.cos(a2) * r * 0.98, Math.sin(a2) * r * 0.98);
    c.lineTo(Math.cos(a2) * rCoreEdge, Math.sin(a2) * rCoreEdge);
    c.closePath();

    let armGrad = c.createLinearGradient(0, 0, Math.cos(aCenter) * r, Math.sin(aCenter) * r);
    armGrad.addColorStop(0, '#ffffff');
    armGrad.addColorStop(0.5, '#dddddd');
    armGrad.addColorStop(1, '#667788');

    c.fillStyle = armGrad;
    c.fill();
    c.strokeStyle = '#ffffff';
    c.lineWidth = 1.0;
    c.stroke();
  }

  // D. 中央正四面体 (ピラミッド) コア (レッド系統)
  let cSize = r * 0.28;
  let coreCorner = [
    { x: 0, y: -cSize },
    { x: cSize, y: 0 },
    { x: 0, y: cSize },
    { x: -cSize, y: 0 }
  ];
  let apex = { x: -cSize * 0.15, y: -cSize * 0.15 };

  let faceColors = ['#ff88a0', '#ff2255', '#cc0033', '#880022'];
  for (let i = 0; i < 4; i++) {
    let p1 = coreCorner[i];
    let p2 = coreCorner[(i + 1) % 4];

    c.beginPath();
    c.moveTo(apex.x, apex.y);
    c.lineTo(p1.x, p1.y);
    c.lineTo(p2.x, p2.y);
    c.closePath();

    c.fillStyle = faceColors[i];
    c.fill();
    c.strokeStyle = '#ffeeff';
    c.lineWidth = 1.0;
    c.stroke();
  }

  c.beginPath();
  c.arc(apex.x, apex.y, 2.8, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.shadowBlur = 8;
  c.shadowColor = '#ff0055';
  c.fill();

  c.restore();
}
// ★ ロペ（LOPE）3Dデータ ＆ 描画関数
function create3DLopeCoreAndRingMesh() {
  let vertices = [];
  let faces = [];

  const sides = 12;

  const rCoreTop = 3.8;
  const rCoreMid = 7.8;
  const rCoreBase = 8.5;

  const zCoreTop = 5.5;
  const zCoreMid = 3.0;
  const zCoreBase = 1.0;

  let cStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreTop, y: Math.sin(a) * rCoreTop, z: zCoreTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreMid, y: Math.sin(a) * rCoreMid, z: zCoreMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreBase, y: Math.sin(a) * rCoreBase, z: zCoreBase });
  }

  let coreTopV = [];
  for (let i = 0; i < sides; i++) coreTopV.push(cStart + i);
  faces.push({ v: coreTopV, color: '#ffea80', stroke: '#ffffff', layer: 0 });

  for (let i = 0; i < sides; i++) {
    let t1 = cStart + i;
    let t2 = cStart + ((i + 1) % sides);
    let m1 = cStart + sides + i;
    let m2 = cStart + sides + ((i + 1) % sides);
    let c = (i % 2 === 0) ? '#ffaa00' : '#ff8800';
    faces.push({ v: [t1, t2, m2, m1], color: c, stroke: '#ffd580', layer: 0 });
  }

  for (let i = 0; i < sides; i++) {
    let m1 = cStart + sides + i;
    let m2 = cStart + sides + ((i + 1) % sides);
    let b1 = cStart + sides * 2 + i;
    let b2 = cStart + sides * 2 + ((i + 1) % sides);
    let c = (i % 2 === 0) ? '#e67700' : '#cc5500';
    faces.push({ v: [m1, m2, b2, b1], color: c, stroke: '#ffaa00', layer: 0 });
  }

  const rRingIn = 10.2;
  const rRingOut = 16.5;
  const zRingTop = 2.5;
  const zRingBase = 0.0;

  let rStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rRingIn, y: Math.sin(a) * rRingIn, z: zRingTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rRingOut, y: Math.sin(a) * rRingOut, z: zRingBase });
  }

  for (let i = 0; i < sides; i++) {
    let in1 = rStart + i;
    let in2 = rStart + ((i + 1) % sides);
    let out1 = rStart + sides + i;
    let out2 = rStart + sides + ((i + 1) % sides);
    let isAlt = i % 2 === 0;
    let c = isAlt ? '#00aaff' : '#0066cc';
    faces.push({ v: [in1, in2, out2, out1], color: c, stroke: '#80d4ff', layer: 1 });
  }

  return { vertices, faces };
}

const LOPE_3D_MESH = create3DLopeCoreAndRingMesh();

function draw3DLope(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = LOPE_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = LOPE_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke) {
      c.strokeStyle = f.stroke;
      c.lineWidth = 0.8;
      c.stroke();
    }
  });
  c.restore();
}

// ★ パタータ（PATARTA）3Dデータ ＆ 描画関数
function createHorizontalPatartaMesh() {
  let vertices = [];
  let faces = [];

  const zFront = 4.0;

  function addV(x, y, z) {
    vertices.push({ x, y, z });
    return vertices.length - 1;
  }

  const outerX = 18.0;
  const innerX = 5.5;

  let vLT_out = addV(-outerX, -18, zFront);
  let vLT_in  = addV(-innerX, -18, zFront);
  let vRT_in  = addV( innerX, -18, zFront);
  let vRT_out = addV( outerX, -18, zFront);

  const slitBottomY = 2.0;

  let vLM_out = addV(-outerX, slitBottomY, zFront);
  let vLM_in  = addV(-innerX, slitBottomY, zFront);
  let vRM_in  = addV( innerX, slitBottomY, zFront);
  let vRM_out = addV( outerX, slitBottomY, zFront);

  const bottomSegs = 8;
  let bOutIdx = [];
  for (let i = 0; i <= bottomSegs; i++) {
    let angle = (i / bottomSegs) * Math.PI;
    let cosA = -Math.cos(angle);
    let sinA = Math.sin(angle);
    bOutIdx.push(addV(cosA * outerX, sinA * outerX * 0.9 + slitBottomY, zFront));
  }

  faces.push({ v: [vLT_out, vLT_in, vLM_in, vLM_out], color: '#d9f580', stroke: '#ffffff', zOffset: 0 });
  faces.push({ v: [vRT_in, vRT_out, vRM_out, vRM_in], color: '#d9f580', stroke: '#ffffff', zOffset: 0 });

  for (let i = 0; i < bottomSegs; i++) {
    let o1 = bOutIdx[i], o2 = bOutIdx[i+1];
    let c = (i % 2 === 0) ? '#ccff33' : '#b8e62e';
    faces.push({ v: [o1, o2, vRM_in, vLM_in], color: c, stroke: '#ffffff', zOffset: 0 });
  }

  let vL_d1 = addV(-16, -14, zFront + 1.2);
  let vL_d2 = addV(-innerX - 1.5, -14, zFront + 1.2);
  let vL_d3 = addV(-innerX - 1.5,  -2, zFront + 1.2);
  let vL_d4 = addV(-16,  -2, zFront + 1.2);
  faces.push({ v: [vL_d1, vL_d2, vL_d3, vL_d4], color: '#99cc00', stroke: '#ffffff', zOffset: 2 });

  let vR_d1 = addV( innerX + 1.5, -14, zFront + 1.2);
  let vR_d2 = addV( 16, -14, zFront + 1.2);
  let vR_d3 = addV( 16,  -2, zFront + 1.2);
  let vR_d4 = addV( innerX + 1.5,  -2, zFront + 1.2);
  faces.push({ v: [vR_d1, vR_d2, vR_d3, vR_d4], color: '#99cc00', stroke: '#ffffff', zOffset: 2 });

  const zCore = zFront + 2.0;

  let vP1 = addV(-innerX, slitBottomY, zCore);
  let vP2 = addV( innerX, slitBottomY, zCore);
  let vP3 = addV( innerX, slitBottomY + 7.0, zCore);
  let vP4 = addV(-innerX, slitBottomY + 7.0, zCore);

  faces.push({ v: [vP1, vP2, vP3, vP4], color: '#ffffff', stroke: '#99ff33', zOffset: 4 });

  let vPB1 = addV(-innerX, slitBottomY, zFront + 0.5);
  let vPB2 = addV( innerX, slitBottomY, zFront + 0.5);
  faces.push({ v: [vP1, vP2, vPB2, vPB1], color: '#77aa00', stroke: '#b8e62e', zOffset: 3 });

  let vGun1 = addV(-2.2, slitBottomY + 2.0, zCore + 0.3);
  let vGun2 = addV( 2.2, slitBottomY + 2.0, zCore + 0.3);
  let vGun3 = addV( 2.2, slitBottomY + 5.5, zCore + 0.3);
  let vGun4 = addV(-2.2, slitBottomY + 5.5, zCore + 0.3);
  faces.push({ v: [vGun1, vGun2, vGun3, vGun4], color: '#1a2b00', stroke: '#99ff33', zOffset: 5 });

  return { vertices, faces };
}

const PATARTA_3D_MESH = createHorizontalPatartaMesh();

function draw3DPatarta(c, w, h, baseColor) {
  c.save();
  c.translate(w / 2, h / 2);

    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);

    if (f.stroke) {
      c.strokeStyle = f.stroke;
      c.lineWidth = 0.8;
      c.stroke();
    }
  });
  c.restore();
}

// ★ ジラール（GIRARD）3Dデータ ＆ 描画関数
function createDarkPurpleGirardMesh() {
  let vertices = [];
  let faces = [];

  const sides = 12;
  const rCoreTop = 4.0;
  const rCoreBase = 8.5;
  const zTop = 5.0;
  const zBase = 1.0;

  let cStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rCoreTop, y: Math.sin(a) * rCoreTop, z: zTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rCoreBase, y: Math.sin(a) * rCoreBase, z: zBase });
  }

  let topV = [];
  for (let i = 0; i < sides; i++) topV.push(cStart + i);
  faces.push({ v: topV, color: '#aa33ff', stroke: '#ff88ff', layer: 0 });

  for (let i = 0; i < sides; i++) {
    let t1 = cStart + i;
    let t2 = cStart + ((i + 1) % sides);
    let b1 = cStart + sides + i;
    let b2 = cStart + sides + ((i + 1) % sides);

    let c = (i % 2 === 0) ? '#440066' : '#220033';
    faces.push({ v: [t1, t2, b2, b1], color: c, stroke: '#9922dd', layer: 0 });
  }

  const armLenInner = 8.0;
  const armLenOuter = 16.0;
  const armW = 1.2;
  const bladeL = 7.0;
  const bladeW = 1.8;
  const zArm = 2.5;

  for (let i = 0; i < 4; i++) {
    let baseAngle = (i * Math.PI) / 2;
    let cosA = Math.cos(baseAngle);
    let sinA = Math.sin(baseAngle);

    let perpX = -sinA;
    let perpY = cosA;

    let aIdx = vertices.length;
    vertices.push({ x: cosA * armLenInner - perpX * armW, y: sinA * armLenInner - perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenInner + perpX * armW, y: sinA * armLenInner + perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenOuter + perpX * armW, y: sinA * armLenOuter + perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenOuter - perpX * armW, y: sinA * armLenOuter - perpY * armW, z: zArm });

    faces.push({ v: [aIdx, aIdx + 1, aIdx + 2, aIdx + 3], color: '#150025', stroke: '#661199', layer: 1 });

    let bIdx = vertices.length;
    let bx = cosA * armLenOuter;
    let by = sinA * armLenOuter;

    vertices.push({ x: bx - perpX * bladeL, y: by - perpY * bladeL, z: zArm + 0.5 });
    vertices.push({ x: bx + perpX * bladeL, y: by + perpY * bladeL, z: zArm + 0.5 });
    vertices.push({ x: bx + cosA * bladeW + perpX * bladeL, y: by + sinA * bladeW + perpY * bladeL, z: zArm });
    vertices.push({ x: bx + cosA * bladeW - perpX * bladeL, y: by + sinA * bladeW - perpY * bladeL, z: zArm });

    faces.push({ v: [bIdx, bIdx + 1, bIdx + 2, bIdx + 3], color: '#cc00ff', stroke: '#ffaa00', layer: 2 });
  }

  return { vertices, faces };
}

const GIRARD_3D_MESH = createDarkPurpleGirardMesh();

function draw3DGirard(c, w, h, baseColor, rotZAnim) {
  c.save();

function draw3DQuiri(c, w, h, baseColor, rotYAnim) {

  let scale = w / 32.0;
  let cameraDist = 350;
  let rotX = 0.45;
  let rotY = rotYAnim || 0;

  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let transformed = QUIRI_3D_MESH.vertices.map(v => {
    let x1 = v.x * cosY + v.z * sinY;
    let z1 = -v.x * sinY + v.z * cosY;
    let y2 = v.y * cosX - z1 * sinX;
    let z2 = v.y * sinX + z1 * cosX;
    let perspective = cameraDist / (cameraDist + z2 + 100);
    return { x: x1 * scale * perspective, y: y2 * scale * perspective, z: z2 };
  });

  let renderFaces = QUIRI_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    return { pts, color: f.c, z: avgZ };
  });

  renderFaces.sort((a, b) => b.z - a.z);

  renderFaces.forEach(f => {

    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);

    c.fill();
    c.strokeStyle = "rgba(255, 200, 200, 0.4)";
    c.lineWidth = 0.8;
    c.stroke();
  });
  c.restore();
}

// ★ スプリッタ（SPLITTA）3D描画関数
function createSplittaMesh() {
  let vertices = [];
  let faces = [];

  const s = 16;
  const border = 3;
  const bIn = s - border;
  const cs = 5;
  const hTop = 4;
  const hMid = 1;
  const hBot = -4;

  vertices.push({ x: -s, y: -s, z: hTop });
  vertices.push({ x:  s, y: -s, z: hTop });
  vertices.push({ x:  s, y:  s, z: hTop });
  vertices.push({ x: -s, y:  s, z: hTop });

  vertices.push({ x: -bIn, y: -bIn, z: hTop });
  vertices.push({ x:  bIn, y: -bIn, z: hTop });
  vertices.push({ x:  bIn, y:  bIn, z: hTop });
  vertices.push({ x: -bIn, y:  bIn, z: hTop });

  vertices.push({ x: -bIn + 1.5, y: -bIn + 1.5, z: hMid });
  vertices.push({ x:  bIn - 1.5, y: -bIn + 1.5, z: hMid });

  vertices.push({ x: -cs, y: -cs, z: 0 });

  vertices.push({ x:  cs, y:  cs, z: 0 });
  vertices.push({ x: -cs, y:  cs, z: 0 });

  vertices.push({ x: 0, y: 0, z: hTop + 2 });

  vertices.push({ x: -s, y: -s, z: hBot });
  vertices.push({ x:  s, y: -s, z: hBot });
  vertices.push({ x:  s, y:  s, z: hBot });
  vertices.push({ x: -s, y:  s, z: hBot });

  faces.push({ v: [12, 13, 14, 15], c: '#00aaff', stroke: '#88ffff' });
  faces.push({ v: [8, 9, 13, 12], c: '#0033aa', stroke: 'none' });
  faces.push({ v: [9, 10, 14, 13], c: '#002288', stroke: 'none' });
  faces.push({ v: [10, 11, 15, 14], c: '#001155', stroke: 'none' });
  faces.push({ v: [11, 8, 12, 15], c: '#0033aa', stroke: 'none' });

  faces.push({ v: [4, 5, 9, 8], c: '#aa5500', stroke: 'none' });
  faces.push({ v: [5, 6, 10, 9], c: '#884400', stroke: 'none' });
  faces.push({ v: [6, 7, 11, 10], c: '#663300', stroke: 'none' });
  faces.push({ v: [7, 4, 8, 11], c: '#aa5500', stroke: 'none' });

  faces.push({ v: [0, 1, 5, 4], c: '#ffaa00', stroke: '#ffaa00' });
  faces.push({ v: [1, 2, 6, 5], c: '#dd8800', stroke: '#dd8800' });
  faces.push({ v: [2, 3, 7, 6], c: '#bb6600', stroke: '#bb6600' });

  faces.push({ v: [0, 4, 16], c: '#ffcc00', stroke: '#ffee66' });
  faces.push({ v: [1, 5, 16], c: '#ffaa00', stroke: '#ffee66' });
  faces.push({ v: [2, 6, 16], c: '#dd8800', stroke: '#ffcc44' });

  faces.push({ v: [0, 17, 18, 1], c: '#ff8800', stroke: 'none' });
  faces.push({ v: [1, 18, 19, 2], c: '#cc6600', stroke: 'none' });
  faces.push({ v: [2, 19, 20, 3], c: '#aa4400', stroke: 'none' });
  faces.push({ v: [3, 20, 17, 0], c: '#dd7700', stroke: 'none' });

  return { vertices, faces };
}

const SPLITTA_3D_MESH = createSplittaMesh();

function draw3DSplitta(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 32.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = SPLITTA_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = SPLITTA_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    return { pts, color: f.c, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke && f.stroke !== 'none') {
      c.strokeStyle = f.stroke;
      c.lineWidth = 1.0;
      c.stroke();
    } else {
      c.strokeStyle = "rgba(0, 0, 0, 0.3)";
      c.lineWidth = 0.5;
      c.stroke();
    }
  });
  c.restore();
}

// ★ ティッタ（TITTA）描画
function draw2D3DStyleTitta(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w / 2;
  c.beginPath();
  c.arc(0, 0, r, 0, Math.PI * 2);
  let sphereGrad = c.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.3, baseColor || '#00e5ff');
  sphereGrad.addColorStop(0.85, '#0088cc');
  sphereGrad.addColorStop(1, '#004466');
  c.fillStyle = sphereGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  c.lineWidth = 1;
  c.stroke();

  let gw = r * 0.28;
  c.fillStyle = '#111e2e';
  c.fillRect(-r, -gw / 2, r * 2, gw);
  c.fillRect(-gw / 2, -r, gw, r * 2);

  c.fillStyle = 'rgba(0, 0, 0, 0.6)';
  c.fillRect(-r, -gw / 2, r * 2, 2);
  c.fillRect(-gw / 2, -r, 2, r * 2);

  c.fillStyle = 'rgba(255, 255, 255, 0.35)';
  c.fillRect(-r, gw / 2 - 1.5, r * 2, 1.5);
  c.fillRect(gw / 2 - 1.5, -r, 1.5, r * 2);

  const margin = gw / 2 + 0.5;
  const pSize = r - margin;

  function drawDomePanel(xSign, ySign) {
    c.save();
    c.beginPath();
    let px = xSign * margin;
    let py = ySign * margin;
    c.moveTo(px, py);
    c.lineTo(px + xSign * pSize, py);
    c.arc(0, 0, r - 0.5, Math.atan2(py, px + xSign * pSize), Math.atan2(py + ySign * pSize, px), (xSign * ySign < 0));
    c.lineTo(px, py + ySign * pSize);
    c.closePath();

    let pGrad = c.createRadialGradient(xSign * r * 0.3, ySign * r * 0.3, r * 0.05, 0, 0, r);
    pGrad.addColorStop(0, '#ffffff');
    pGrad.addColorStop(0.35, baseColor || '#00e5ff');
    pGrad.addColorStop(0.85, '#0088cc');
    pGrad.addColorStop(1, '#004477');

    c.fillStyle = pGrad;
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    c.lineWidth = 0.8;
    c.stroke();
    c.restore();
  }

  drawDomePanel(1, -1);
  drawDomePanel(-1, -1);
  drawDomePanel(-1, 1);
  drawDomePanel(1, 1);

  c.beginPath();
  c.arc(0, 0, gw * 0.8, 0, Math.PI * 2);
  c.fillStyle = '#223344';
  c.fill();
  c.strokeStyle = '#00ffff';
  c.lineWidth = 1;
  c.stroke();

  c.beginPath();
  c.arc(0, 0, gw * 0.35, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();

  c.restore();
}

// ★ リーバ（RIVA）描画
function createOctagonPath(c, r) {
  c.beginPath();
  for (let i = 0; i < 8; i++) {
    let a = (i * Math.PI / 4) + (Math.PI / 8);
    let x = Math.cos(a) * r;
    let y = Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y);
    else c.lineTo(x, y);
  }
  c.closePath();
}

function draw2D3DStyleRiva(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w * 0.44;
  let mainColor = baseColor || '#ffff00';

  c.save();

  let sphereGrad = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.35, mainColor);
  sphereGrad.addColorStop(0.8, '#cc9900');
  sphereGrad.addColorStop(1, '#442200');

  c.fillStyle = sphereGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 200, 0.7)';
  c.lineWidth = 1.2;
  c.stroke();
  c.restore();

  let bandW = r * 0.40;

  c.save();
  createOctagonPath(c, r);
  c.clip();

  c.beginPath();
  c.rect(-bandW / 2, -r, bandW, r * 2);
  c.rect(-r, -bandW / 2, r * 2, bandW);

  let bandGrad = c.createLinearGradient(-r, -r, r, r);
  bandGrad.addColorStop(0, '#ffffff');
  bandGrad.addColorStop(0.3, '#ffffaa');
  bandGrad.addColorStop(0.7, mainColor);
  bandGrad.addColorStop(1, '#885500');

  c.fillStyle = bandGrad;
  c.fill();

  c.fillStyle = 'rgba(255, 255, 255, 0.7)';
  c.fillRect(-bandW / 2, -r, 1.5, r * 2);
  c.fillRect(-r, -bandW / 2, r * 2, 1.5);

  c.fillStyle = 'rgba(0, 0, 0, 0.5)';
  c.fillRect(bandW / 2 - 1.5, -r, 1.5, r * 2);
  c.fillRect(-r, bandW / 2 - 1.5, r * 2, 1.5);

  c.restore();

  let coreR = bandW * 0.38;
  c.save();
  c.beginPath();
  c.arc(0, 0, coreR, 0, Math.PI * 2);

  let coreGrad = c.createRadialGradient(-coreR * 0.3, -coreR * 0.3, coreR * 0.05, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, '#ffdd00');
  coreGrad.addColorStop(0.8, '#ff5500');
  coreGrad.addColorStop(1, '#441100');

  c.fillStyle = coreGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.25, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.restore();
}

// ★ ネイラ（NEIRA）描画
function drawPolygonPath(c, r, sides) {
  c.beginPath();
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2 / sides) - Math.PI / 2;
    let x = Math.cos(a) * r;
    let y = Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y);
    else c.lineTo(x, y);
  }
  c.closePath();
}

function draw2D3DStyleNeira(c, w, h, baseColor, rotYAnim) {

  let mainColor = baseColor || '#00ffcc';

  c.save();
  let sqSize = r * 0.95;

  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  c.lineWidth = 1;

  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.25, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.restore();

// 6. ゲームエンティティ (Enemy クラス)
// ==========================================
class Enemy {
  constructor(x, y, t, o = {}) {
    this.type = t; this.toRemove = false; this.lifeTime = 0; this.formationOffset = o.offset || 0;
    this.def = ENEMY_TYPES[t] || ENEMY_TYPES['GALLI'];
    this.pat = ENEMY_PATTERNS_DATA[t] || ENEMY_PATTERNS_DATA['GALLI'];
    this.hp = (t === 'GIRARD') ? 8 : (this.def.hp || 1); this.score = this.def.score || 100;
    this.isWeak = o.weak || false; this.isFast = o.fast || false;
    let sh = this.def.shape;
    this.width = (sh === 'carrier' || t === 'GUILER') ? 64 : (sh === 'heavy' || t === 'PATARTA' || t === 'SULTAN' || t === 'GADOHA' || t === 'AMARA' || t === 'TOPPER' ? 36 : (sh === 'star' ? 16 : 28)); this.height = this.width;
    
    let effArea = isLooped ? 10 : Math.min(10, areaLevel);
    let bfm = effArea >= 5 ? Math.max(0.4, 1.0 - (effArea - 4) * 0.1) : 1.0;
    this.shotTimer = (sh === 'carrier' ? 60 : (80 + Math.random() * 30)) * (bfm / fireModifier); this.state = 'enter';

    if (this.type === 'RIVA' && player) {
      this.isFromLeft = Math.random() < 0.5; this.x = this.isFromLeft ? -40 : canvas.width + 10; this.y = -40; this.startX = this.x; this.startY = this.y;
    } else if (this.type === 'GUILER') {
      this.x = isNaN(x) ? canvas.width / 2 - 32 : x;
      this.y = canvas.height + 50;
      this.startX = this.x; this.startY = this.y;
    } else {
      this.x = isNaN(x) ? canvas.width / 2 : x; this.y = isNaN(y) ? -50 : y; this.startX = this.x; this.startY = this.y;
    }
  }
  
  update() {
    try {
      this.lifeTime++;
      let effArea = isLooped ? 10 : Math.min(10, areaLevel);
      let baseSpeed = this.pat.speed || 3;
      let spd = (baseSpeed / 3.0) * (1.0 + (effArea >= 5 ? (effArea - 4) * 0.05 : 0)) * (this.isFast ? 2.0 : 1.0);
      let cat = this.pat.category;
      let p = this.pat.params || {};

      if (this.type === 'GUILER') {
        this.y -= 1.2 * spd;
        this.x = this.startX + Math.sin(this.lifeTime * 0.04 + this.formationOffset) * 50;
        
        let normalEnemiesCount = enemies.filter(e => e.type !== 'GUILER').length;
        if (this.lifeTime % 30 === 0 && this.y > 80 && this.y < canvas.height - 80 && normalEnemiesCount < 16) {
          let currentQuiri = enemies.filter(e => e.type === 'QUIRI').length;
          if (currentQuiri < 8) {
            enemies.push(new Enemy(this.x + 24, this.y, 'QUIRI'));
          }
        }
      }
      else if (cat === 'swingby') {
        let trigY = p.swingByTriggerY || 400;
        let curve = p.swingByCurve || 0.06;
        if (this.state === 'enter') {
          this.y += 3.5 * spd;
          if (this.y >= trigY) {
            this.state = 'swing';
            this.swingAngle = 0;
          }
        } else if (this.state === 'swing') {
          this.swingAngle += curve;
          this.x += Math.sin(this.swingAngle) * 8.0 * spd;
          this.y -= Math.cos(this.swingAngle) * 4.0 * spd;
          if (this.swingAngle >= Math.PI) this.state = 'exit';
        } else {
          this.y -= 4.0 * spd;
        }
      }
      else if (cat === 'sine') {
        let amp = p.amplitude !== undefined ? p.amplitude : 60;
        let freq = p.frequency || 0.05;
        this.y += 2.5 * spd;
        this.x = this.startX + Math.sin(this.lifeTime * freq + this.formationOffset) * amp;
      } 
      else if (cat === 'turn') {
        let turnY = p.turnY || 480;
        let turnType = p.turnType || "u_turn";
        if (this.state === 'enter') {
          this.y += 3.5 * spd;
          if (this.y >= turnY) {
            this.state = 'turn';
            if (turnType === 'right_angle') {
              this.vx = (this.x < canvas.width / 2) ? 4.5 * spd : -4.5 * spd;
            } else {
              this.vx = (player && this.x < player.x) ? 3.0 * spd : -3.0 * spd;
            }
          }
        } else {
          if (turnType === 'right_angle') {
            this.x += this.vx;
          } else {
            this.x += this.vx;
            this.y -= 2.5 * spd;
          }
        }
      } 
      else if (cat === 'pause') {
        let pauseY = p.pauseY || 200;
        if (this.state === 'enter') {
          this.y += 3.0 * spd;
          if (this.y >= pauseY) {
            this.state = 'stop';
            this.stopTimer = 45;
          }
        } else if (this.state === 'stop') {
          this.stopTimer--;
          if (this.stopTimer <= 0) this.state = 'leave';
        } else if (this.state === 'leave') {
          this.y += 3.0 * spd;
        }
      }
      else if (cat === 'dive') {
        if (this.lifeTime === 1 && player) {
          let a = Math.atan2(player.y - this.y, player.x - this.x);
          this.vx = Math.cos(a) * 6.5 * spd;
          this.vy = Math.sin(a) * 6.5 * spd;
        }
        this.x += this.vx || 0;
        this.y += this.vy || (6.5 * spd);
      }
      else if (cat === 'special' && p.path && p.path.length > 0) {
        let t = (this.lifeTime * 0.01) % p.path.length;
        let idx = Math.floor(t);
        let nextIdx = (idx + 1) % p.path.length;
        let factor = t - idx;
        let p1 = p.path[idx], p2 = p.path[nextIdx];
        this.x = p1.x + (p2.x - p1.x) * factor;
        this.y = p1.y + (p2.y - p1.y) * factor;
      }
      else {
        this.y += 2.5 * spd;
      }

      if (this.type !== 'RIVA') {
        if (this.y > canvas.height + 80 || this.y < -150 || this.x < -150 || this.x > canvas.width + 150) {
          this.toRemove = true;
        }
      }

      let isInScreen = (this.x >= 0 && this.x + this.width <= canvas.width && this.y >= 0 && this.y + this.height <= canvas.height);

      if (!this.isWeak && player && !isNaN(player.x) && !isNaN(player.y) && enemyBullets.length < 15 && !player.isDestroyed) {
        if (!(gameState === 'PLAYING' && areaFrames >= 3900)) {
          this.shotTimer--;
          if (this.shotTimer <= 0 && isInScreen) {
            let cx = this.x + this.width / 2, cy = this.y + this.height / 2;
            let bs = 1.0 + (effArea >= 5 ? (effArea - 4) * 0.1 : 0);
            let bfm = effArea >= 5 ? Math.max(0.4, 1.0 - (effArea - 4) * 0.1) : 1.0;
            if (this.type !== 'GADOHA' && this.type !== 'PATARTA') {
              enemyBullets.push(new EnemyBullet(cx, cy, player.x + 16, player.y + 20, bs));
              this.shotTimer = (80 + Math.random() * 60) * (bfm / fireModifier);
            }
          }
        }
      }
    } catch (e) { this.toRemove = true; }
  }
  
  draw() { 
    try { 
      if (isNaN(this.x) || isNaN(this.y)) return; 
      ctx.save(); 
      ctx.translate(this.x, this.y); 
      let c = this.def.color || '#ffffff'; 
      ctx.shadowBlur = 15; 
      ctx.shadowColor = c; 
      
      if (this.type === 'GALLI') {
        draw3DGalli(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'TITTA') {
        draw2D3DStyleTitta(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'ZOFF') {
        draw2D3DStyleZoff(ctx, this.width, this.height, c);
      } else if (this.type === 'FAILLAR') {
        draw2D3DStyleFaillar(ctx, this.width, this.height, c);
      } else if (this.type === 'MEEUWS') {
        draw2D3DStyleMeeuws(ctx, this.width, this.height, c);
      } else if (this.type === 'OBSESS') {
        draw2D3DStyleObsess(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'RIVA') {
        draw2D3DStyleRiva(ctx, this.width, this.height, '#ffff00', -this.lifeTime * 0.05);
      } else if (this.type === 'NEIRA') {
        draw2D3DStyleNeira(ctx, this.width, this.height, '#00ffcc', -this.lifeTime * 0.05);
      } else if (this.type === 'ETTORI') {
        draw3DEttori(ctx, this.width, this.height, c, -this.lifeTime * 0.04);
      } else if (this.type === 'LOPE') {
        draw3DLope(ctx, this.width, this.height, c, -this.lifeTime * 0.04);
      } else if (this.type === 'GIRARD') {
        draw3DGirard(ctx, this.width, this.height, '#cc00ff', -this.lifeTime * 0.03);
      } else if (this.type === 'QUIRI') {
        draw3DQuiri(ctx, this.width, this.height, '#ff3333', this.lifeTime * 0.04);
      } else if (this.type === 'SPLITTA') {
        draw3DSplitta(ctx, this.width, this.height, c, -this.lifeTime * 0.03);
      } else if (this.type === 'PATARTA') {
        draw3DPatarta(ctx, this.width, this.height, c);
      } else if (this.type === 'SULTAN') {
        draw3DSultan(ctx, this.width, this.height, c);
      } else if (this.type === 'GADOHA') {
        draw3DGadoha(ctx, this.width, this.height, -this.lifeTime * 0.03);
      } else if (this.type === 'AMARA') {
        draw3DAmara(ctx, this.width, this.height, -this.lifeTime * 0.04);
      } else if (this.type === 'TOPPER') {
        draw3DTopper(ctx, this.width, this.height);
      } else if (this.type === 'SUPER_SONIC') {
        draw2D3DStyleSuperSonic(ctx, this.width, this.height);
      } else if (this.type === 'GUILER') {
        draw2D3DStyleGuiler(ctx, this.width, this.height);
      } else {
        drawDetailedEnemyShape(ctx, this.def.shape || 'delta', c, this.width, this.height); 
      }
      ctx.restore(); 
    } catch (e) {} 
  }
}

class Larios {
  constructor() { 
    this.x = canvas.width / 2 - 32; 
    this.y = 100; 
    this.width = 64; 
    this.height = 64; 
    this.hp = 8; 
    this.isAssembled = false; 
    this.assembleTimer = 120; 
    this.partsOffset = 80; 
    this.toRemove = false; 
  }
  
  update() { 
    if (!this.isAssembled) { 
      this.assembleTimer--; 
      this.partsOffset = (this.assembleTimer / 120) * 80; 
      if (this.assembleTimer <= 0) { 
        this.isAssembled = true; 
        this.partsOffset = 0; 
      } 
    } else { 
      this.y += 0.8; 
      if (this.y > canvas.height + 50) this.toRemove = true; 
      let effArea = isLooped ? 10 : Math.min(10, areaLevel);
      if (gameFrames % Math.max(20, 45 - effArea * 5) === 0 && player && !player.isDestroyed && !(gameState === 'PLAYING' && areaFrames >= 3900) && enemyBullets.length < 15) { 
        enemyBullets.push(new EnemyBullet(this.x + 32, this.y + 32, player.x + 16, player.y + 20, 1.0 + (effArea * 0.06))); 
      } 
    } 
  }
  
  draw() { 
    ctx.save(); 
    let rotAngle = gameFrames * 0.02;
    draw2D3DStyleLariosParts(ctx, this.x + 32, this.y + 32, this.partsOffset, this.isAssembled, rotAngle);
    ctx.restore(); 
  }
}

class AreaBoss {
  constructor() { 
    this.width = 160; this.height = 100; 
    this.x = canvas.width / 2 - this.width / 2; 
    this.y = -120; 
    this.hp = 30 + (areaLevel * 20); this.maxHp = this.hp; 
    this.state = 'ENTER'; this.toRemove = false; this.shotTimer = 0;
    this.bossType = (areaLevel - 1) % 8; 
    
    let themeIndex = (areaLevel - 1) % AREA_THEME_COLORS.length;
    this.themeColor = AREA_THEME_COLORS[themeIndex].bossTheme || '#00ffff';
    
    let lastDigit = Math.floor(Math.abs(score)) % 10;
    this.vx = (lastDigit % 2 !== 0) ? -2.5 : 2.5;
  }
  
  update() { 
    if (this.state === 'ENTER') { 
      this.x = canvas.width / 2 - this.width / 2;
      this.y += 1.5; 
      
      if (this.y >= 50) {
        this.y = 50;
        this.state = 'COMBAT'; 
      }
    } else if (this.state === 'DEFEATED') { 
      this.x += (Math.random() - 0.5) * 4; this.y += (Math.random() - 0.5) * 4; 
    } else { 
      this.x += this.vx;
      
      const minX = 10;
      const maxX = canvas.width - this.width - 10;
      if (this.x <= minX) {
        this.x = minX;
        this.vx *= -1;
      } else if (this.x >= maxX) {
        this.x = maxX;
        this.vx *= -1;
      }
      
this.shotTimer--; 
      if (this.shotTimer <= 0 && player && !player.isDestroyed && enemyBullets.length < 18) { 
        let cx = this.x + this.width / 2, cy = this.y + this.height - 10;
        let spdBase = 1.0 + Math.min(areaLevel * 0.08, 1.2);
        
        // 自機への基本角度（扇形弾幕用）
        let angleToPlayer = Math.atan2(player.y - cy, player.x + 16 - cx);

        switch (this.bossType) {
          case 0: // Fortress Dome (自機狙い5WAY散弾 ＋ 直下レーザー)
            for (let i = -2; i <= 2; i++) {
              let ang = angleToPlayer + (i * 0.15);
              let tx = cx + Math.cos(ang) * 200;
              let ty = cy + Math.sin(ang) * 200;
              enemyBullets.push(new EnemyBullet(cx, cy, tx, ty, spdBase));
            }
            if (Math.random() > 0.4) {
              let eb = new EnemyBullet(cx, cy, cx, canvas.height);
              eb.speedMult = 3.5; eb.isLaser = true;
              enemyBullets.push(eb); audio.playEnemyLaser();
            }
            break;
            
          case 1: // Heavy Cruiser (前方〜下方向扇形8WAY拡散弾)
            // 自機方向を中心に下方120度の範囲へ展開
            for (let i = -3; i <= 3; i++) {
              let ang = angleToPlayer + (i * 0.18);
              let tx = cx + Math.cos(ang) * 200;
              let ty = cy + Math.sin(ang) * 200;
              enemyBullets.push(new EnemyBullet(cx, cy, tx, ty, spdBase * 0.95));
            }
            break;

          case 2: // Diamond Citadel (自機狙い高速3連交差弾)
            [-25, 0, 25].forEach(offX => {
              enemyBullets.push(new EnemyBullet(cx + offX, cy, player.x + 16, player.y + 20, spdBase * 1.2));
            });
            break;

          case 3: // Cross Carrier (左右直下レーザー ＋ 自機追尾3WAY)
            let ebL = new EnemyBullet(cx - 50, cy, cx - 50, canvas.height); ebL.speedMult = 3.0; ebL.isLaser = true;
            let ebR = new EnemyBullet(cx + 50, cy, cx + 50, canvas.height); ebR.speedMult = 3.0; ebR.isLaser = true;
            enemyBullets.push(ebL, ebR); audio.playEnemyLaser();
            
            [-0.2, 0, 0.2].forEach(angOff => {
              let ang = angleToPlayer + angOff;
              enemyBullets.push(new EnemyBullet(cx, cy, cx + Math.cos(ang) * 200, cy + Math.sin(ang) * 200, spdBase * 0.9));
            });
            break;

          case 4: // Twin-Core Spider (左右2連コアから自機へ挟み込み弾)
            [-35, 35].forEach(offX => {
              let ang = Math.atan2(player.y - cy, (player.x + 16) - (cx + offX));
              for (let i = -1; i <= 1; i++) {
                let a = ang + (i * 0.12);
                enemyBullets.push(new EnemyBullet(cx + offX, cy, cx + offX + Math.cos(a) * 200, cy + Math.sin(a) * 200, spdBase));
              }
            });
            break;

          case 5: // Trident Dreadnought (超高速3方向自機集中V字弾)
            [-0.25, 0, 0.25].forEach(radOff => {
              let baseAng = angleToPlayer + radOff;
              let tx = cx + Math.cos(baseAng) * 200;
              let ty = cy + Math.sin(baseAng) * 200;
              enemyBullets.push(new EnemyBullet(cx, cy, tx, ty, spdBase * 1.4));
            });
            break;

          case 6: // Solar Ring Gate (自機方向メインの下半球ワイド放射弾)

    this.isPoweredUp = false;

function spawnWaveFromSequence() {
  if (gameFrames % Math.floor(130 / spawnModifier) !== 0) return;

  if (!lariosSpawnedThisArea && !lariosBoss && areaFrames >= 1800) {
    lariosBoss = new Larios();
    lariosSpawnedThisArea = true;
    return;
  }

  let normalEnemiesCount = enemies.filter(e => e.type !== 'GUILER').length;
  if (normalEnemiesCount >= 16) return;

  let cw = ENEMY_SEQUENCE[sequenceIndex % ENEMY_SEQUENCE.length]; sequenceIndex++;
  
  if (cw.type === 'LARIOS') {
    if (!lariosSpawnedThisArea && !lariosBoss) {
      lariosBoss = new Larios();
      lariosSpawnedThisArea = true;
    }
    return;
  }

  let sameTypeCount = enemies.filter(e => e.type === cw.type).length; 
  let maxCanSpawn = (cw.type === 'GUILER') ? 2 : Math.min(8 - sameTypeCount, 16 - normalEnemiesCount); 
  if (maxCanSpawn <= 0) return;

  let ct = Math.min(maxCanSpawn, Math.max(1, Math.floor(cw.count * spawnModifier))); 
  let formationType = Math.floor(Math.random() * 4); 
  let baseSx = 60 + Math.random() * (canvas.width - 120);
  
  if (cw.type === 'GALLI' || cw.type === 'SULTAN') { 
    baseSx = (player && player.x > canvas.width / 2) ? 20 + Math.random() * 100 : canvas.width - 120 + Math.random() * 100; 
  } else if (cw.type === 'NEIRA' && player) { 
    baseSx = player.x > canvas.width / 2 ? 20 + Math.random() * 50 : canvas.width - 70 + Math.random() * 50; 
  }

  for (let i = 0; i < ct; i++) {
    let sx = baseSx; 
    let sy = (cw.type === 'GUILER') ? canvas.height + 50 : -50;
    if (formationType === 0) { sy -= i * 25; } 
    else if (formationType === 1) { sx = 40 + (i * 35) % (canvas.width - 80); sy = -50 - Math.floor(i / 8) * 30; } 
    else if (formationType === 2) { let mid = Math.floor(ct / 2); sx = baseSx + (i - mid) * 30; sy = -50 - Math.abs(i - mid) * 20; } 
    else if (formationType === 3) { sx = baseSx + i * 20; sy = -50 - i * 20; }
    sx = Math.max(20, Math.min(canvas.width - 20, sx));
    enemies.push(new Enemy(sx, sy, cw.type, { offset: i * 0.4, weak: cw.weak, dense: cw.dense, fast: cw.fast }));
  }
}

function addScore(pts) { 
  score = Math.min(99999999, score + pts); 
  if (score >= nextExtendScore) {
    lives++; 
    audio.playExtend();
    
    extendAnimState = 'IN';
    extendTextX = canvas.width + 100;
    extendAnimFrame = 0;

    if (nextExtendScore === 500000) {
      nextExtendScore = 2000000;
    } else {
      nextExtendScore += 2000000;
    }
  }
}

function handlePlayerHit() {

  explosions.push(new Explosion(player.x + 16, player.y + 20, '#ff2200', true));
  spawnDebris(player.x + 16, player.y + 20, '#ffaa00', 25, 50);

    lives--; 
    respawnTimer = 60;

    setTimeout(() => {
      processGameOver();

    } else if (sh === 'secret_S') { drawBevel(ctx, -24, -24, 48, 48, '#332200'); ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(16, 16); ctx.lineTo(-16, 16); ctx.closePath(); ctx.fill();
    } else if (sh === 'jimda') { drawPolyDome(ctx, 0, 0, 24, 8, '#440044'); ctx.fillStyle = '#ffaa00'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; ctx.stroke();
    } else if (sh === 'bonus_B') { drawBevel(ctx, -24, -24, 48, 48, '#330033'); drawPolyDome(ctx, 0, 0, 14, 8, '#ff00aa'); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('B', 0, 12);
    } else if (sh === 'bonus_b') { drawBevel(ctx, -24, -24, 48, 48, '#330033'); drawPolyDome(ctx, 0, 0, 14, 8, '#ff00aa'); ctx.fillStyle = '#ffffff'; ctx.font = 'bold 32px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('b', 0, 12);
    } else if (sh === 'hidden') { drawBevel(ctx, -24, -24, 48, 48, '#ffffff'); ctx.fillStyle = '#000000'; ctx.font = 'bold 36px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText('H', 0, 14); }

}

function drawCoolTitleTextOnly() {
  ctx.save(); ctx.textAlign = "center"; ctx.font = "italic bold 52px 'Segoe UI', Tahoma, sans-serif";
  ctx.shadowBlur = 30; ctx.shadowColor = "#00ffff"; ctx.fillStyle = "rgba(0, 255, 255, 0.6)"; ctx.fillText("STAR FORCE", canvas.width / 2 + 3, canvas.height / 2 - 37);
  ctx.shadowColor = "#ff0055"; ctx.fillStyle = "rgba(255, 0, 85, 0.6)"; ctx.fillText("STAR FORCE", canvas.width / 2 - 3, canvas.height / 2 - 37);

  ctx.shadowBlur = 15; ctx.shadowColor = "#00ffff"; ctx.fillStyle = tg; ctx.fillText("STAR FORCE", canvas.width / 2, canvas.height / 2 - 40);
  ctx.shadowBlur = 10; ctx.shadowColor = "#ffcc00"; ctx.fillStyle = "#ffcc00"; ctx.font = "bold 18px 'Segoe UI'"; ctx.fillText("— AREA STRIKE EDITION —", canvas.width / 2, canvas.height / 2 + 10);
  ctx.shadowBlur = 0; ctx.fillStyle = "#6688aa"; ctx.font = "12px 'Segoe UI'"; ctx.fillText("© 1984 TEHKAN / 1985 HUDSON / MODERN REMAKE", canvas.width / 2, 600); ctx.restore();
}

function drawMiniPlayerIcon(x, y) {
  ctx.save(); ctx.translate(x, y);
  const wingGrad = ctx.createLinearGradient(0, 0, 0, 16); wingGrad.addColorStop(0, '#ff2255'); wingGrad.addColorStop(1, '#0e1422');
  drawPoly(ctx, [[8,-2], [24,9], [15,15], [8,11], [1,15], [-8,9]], wingGrad);
