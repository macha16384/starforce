<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>STAR FORCE - Ultimate Modern Edition</title>
  <style>
    body { background-color: #03040a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 10px; user-select: none; -webkit-user-select: none; }
    #game-container { position: relative; width: 100%; max-width: 480px; margin: 0 auto; box-shadow: 0 0 40px rgba(0, 200, 255, 0.4); border-radius: 6px; overflow: hidden; }
    canvas { background: linear-gradient(to bottom, #010205 0%, #051022 100%); display: block; width: 100%; height: auto; touch-action: none; }
    .instructions { margin-top: 15px; font-size: 13px; color: #88aacc; letter-spacing: 1px; line-height: 1.6; }
    h1 { font-weight: 300; letter-spacing: 4px; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin: 10px 0; font-size: 24px; }
    @media (max-width: 480px) { body { padding: 5px; } h1 { font-size: 18px; margin: 5px 0; } }
  </style>
</head>
<body>

  <h1>STAR FORCE : AREA STRIKE</h1>
  <div id="game-container">
    <canvas id="canvas" width="480" height="640"></canvas>
  </div>
  <div class="instructions" id="inst-text">
    [ 案 内 ] クリック/タップ または Spaceキー でデバイスを選択してください
  </div>

<script>
// ==========================================
// 1. 定数・設定データの宣言
// ==========================================
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const GREEK_ALPHABETS = ['ALPHA','BETA','GAMMA','DELTA','EPSILON','ZETA','ETA','THETA','IOTA','KAPPA','LAMBDA','MU','NU','XI','OMICRON','PI','RHO','SIGMA','TAU','UPSILON','PHI','CHI','PSI','OMEGA'];
const DEFAULT_HIGH_SCORES = [
  {name:'S.F', score:500000, area:5}, {name:'AAA', score:400000, area:4},
  {name:'BBB', score:300000, area:3}, {name:'CCC', score:200000, area:2},
  {name:'DDD', score:100000, area:1}
];

const AREA_THEME_COLORS = [
  { r: 60, g: 75, b: 90, border: '#88aacc' }, { r: 75, g: 65, b: 85, border: '#aa88cc' }, 
  { r: 55, g: 80, b: 70, border: '#77ccaa' }, { r: 85, g: 75, b: 60, border: '#cca877' }, 
  { r: 80, g: 55, b: 65, border: '#cc7788' }, { r: 50, g: 70, b: 85, border: '#66aacc' }  
];

// ★ ガリ（GALLI）3Dポリゴンデータ
const GALLI_3D_MESH = {
  vertices: [
    {x:-10, y:-12, z:-4}, {x:-3, y:-12, z:-4}, {x:-3, y:2, z:-4}, {x:-10, y:2, z:-4},
    {x:-10, y:-12, z: 4}, {x:-3, y:-12, z: 4}, {x:-3, y:2, z: 4}, {x:-10, y:2, z: 4},
    {x:-6.5, y:7, z:0},
    {x: 3, y:-12, z:-4}, {x: 10, y:-12, z:-4}, {x: 10, y:0, z:-4}, {x: 3, y:0, z:-4},
    {x: 3, y:-12, z: 4}, {x: 10, y:-12, z: 4}, {x: 10, y:0, z: 4}, {x: 3, y:0, z: 4},
    {x: 6.5, y:5, z:0},
    {x:-11, y:1, z:-1}, {x:-5, y:1, z:-1}, {x:-5, y:13, z:-1}, {x:-11, y:11, z:-1},
    {x:-11, y:1, z: 1}, {x:-5, y:1, z: 1}, {x:-5, y:13, z: 1}, {x:-11, y:11, z: 1},
    {x:-3, y:-6, z:-2}, {x: 3, y:-6, z:-2}, {x: 3, y:-2, z:-2}, {x:-3, y:-2, z:-2},
    {x:-3, y:-6, z: 2}, {x: 3, y:-6, z: 2}, {x: 3, y:-2, z: 2}, {x:-3, y:-2, z: 2}
  ],
  faces: [
    { v: [0, 1, 2, 3], c: '#ff3366' }, { v: [5, 4, 7, 6], c: '#ff2255' },
    { v: [4, 0, 3, 7], c: '#e62e5c' }, { v: [1, 5, 6, 2], c: '#ff4d79' },
    { v: [0, 4, 5, 1], c: '#ff3366' },
    { v: [3, 2, 8], c: '#ff668c' }, { v: [2, 6, 8], c: '#e62e5c' },
    { v: [6, 7, 8], c: '#cc2952' }, { v: [7, 3, 8], c: '#ff4d79' },
    { v: [9, 10, 11, 12], c: '#ff3366' }, { v: [14, 13, 16, 15], c: '#ff2255' },
    { v: [13, 9, 12, 16], c: '#ff4d79' }, { v: [10, 14, 15, 11], c: '#e62e5c' },
    { v: [9, 13, 14, 10], c: '#ff3366' },
    { v: [12, 11, 17], c: '#ff668c' }, { v: [11, 15, 17], c: '#e62e5c' },
    { v: [15, 16, 17], c: '#cc2952' }, { v: [16, 12, 17], c: '#ff4d79' },
    { v: [18, 19, 20, 21], c: '#ff2255' }, { v: [23, 22, 25, 24], c: '#e62e5c' },
    { v: [22, 18, 21, 25], c: '#ff4d79' }, { v: [19, 23, 24, 20], c: '#cc2952' },
    { v: [26, 27, 28, 29], c: '#ffffff' }, { v: [31, 30, 33, 32], c: '#cccccc' },
    { v: [30, 26, 29, 33], c: '#ffffff' }, { v: [27, 31, 32, 28], c: '#aaaaaa' }
  ]
};

function draw3DGalli(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let cameraDist = 350;
  let rotX = 0.4;
  let rotY = rotYAnim || 0;

  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let transformed = GALLI_3D_MESH.vertices.map(v => {
    let x1 = v.x * cosY + v.z * sinY;
    let z1 = -v.x * sinY + v.z * cosY;
    let y2 = v.y * cosX - z1 * sinX;
    let z2 = v.y * sinX + z1 * cosX;
    let perspective = cameraDist / (cameraDist + z2 + 100);
    return { x: x1 * scale * perspective, y: y2 * scale * perspective, z: z2 };
  });

  let renderFaces = GALLI_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    let v0 = pts[0], v1 = pts[1], v2 = pts[2];
    let nx = (v1.y - v0.y) * (v2.z - v0.z) - (v1.z - v0.z) * (v2.y - v0.y);
    let ny = (v1.z - v0.z) * (v2.x - v0.x) - (v1.x - v0.x) * (v2.z - v0.z);
    let nz = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);
    return { pts, color: f.c, z: avgZ, isFront: nz > 0 };
  });

  renderFaces.sort((a, b) => b.z - a.z);

  renderFaces.forEach(f => {
    if (!f.isFront) return;
    c.beginPath(); c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath(); c.fillStyle = f.color; c.fill();
    c.strokeStyle = "rgba(255, 255, 255, 0.25)"; c.lineWidth = 0.8; c.stroke();
  });
  c.restore();
}

// ★ エトリ（ETTORI）3Dデータ ＆ 描画関数
function createLightEttori3DMesh() {
  let vertices = [];
  let faces = [];

  const sides = 8;
  const rFlat = 5;
  const rMid = 13;
  const rInner = 9;

  const yTop = -14;
  const yUpperMid = -5;
  const yLowerMid = 5;
  const yBot = 14;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rFlat, y: yTop, z: Math.sin(a) * rFlat });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rMid, y: yUpperMid, z: Math.sin(a) * rMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rInner, y: yUpperMid + 1.5, z: Math.sin(a) * rInner });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rInner, y: yLowerMid - 1.5, z: Math.sin(a) * rInner });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rMid, y: yLowerMid, z: Math.sin(a) * rMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rFlat, y: yBot, z: Math.sin(a) * rFlat });
  }

  faces.push({ v: [0, 1, 2, 3, 4, 5, 6, 7], c: '#f0d0ff' });

  for (let i = 0; i < sides; i++) {
    let t1 = i, t2 = (i + 1) % sides;
    let m1 = i + 8, m2 = (i + 1) % sides + 8;
    faces.push({ v: [t1, m1, m2, t2], c: (i % 2 === 0) ? '#d880ff' : '#a040e0' });
  }
  for (let i = 0; i < sides; i++) {
    let m1 = i + 8, m2 = (i + 1) % sides + 8;
    let in1 = i + 16, in2 = (i + 1) % sides + 16;
    faces.push({ v: [m1, in1, in2, m2], c: (i % 2 === 0) ? '#7722aa' : '#551188' });
  }
  for (let i = 0; i < sides; i++) {
    let in1 = i + 16, in2 = (i + 1) % sides + 16;
    let in3 = (i + 1) % sides + 24, in4 = i + 24;
    faces.push({ v: [in1, in4, in3, in2], c: (i % 2 === 0) ? '#220033' : '#330055' });
  }
  for (let i = 0; i < sides; i++) {
    let in4 = i + 24, in3 = (i + 1) % sides + 24;
    let lm1 = i + 32, lm2 = (i + 1) % sides + 32;
    faces.push({ v: [in4, lm1, lm2, in3], c: (i % 2 === 0) ? '#551188' : '#330066' });
  }
  for (let i = 0; i < sides; i++) {
    let lm1 = i + 32, lm2 = (i + 1) % sides + 32;
    let b1 = i + 40, b2 = (i + 1) % sides + 40;
    faces.push({ v: [lm1, b1, b2, lm2], c: (i % 2 === 0) ? '#8833bb' : '#662299' });
  }
  faces.push({ v: [47, 46, 45, 44, 43, 42, 41, 40], c: '#330044' });

  return { vertices, faces };
}

const ETTORI_3D_MESH = createLightEttori3DMesh();

function draw3DEttori(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = ETTORI_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = [];
  for (let f of ETTORI_3D_MESH.faces) {
    let pts = f.v.map(idx => transformed[idx]);
    let v0 = pts[0], v1 = pts[1], v2 = pts[2];
    let crossZ = (v1.x - v0.x) * (v2.y - v0.y) - (v1.y - v0.y) * (v2.x - v0.x);

    if (crossZ >= 0) {
      let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
      renderFaces.push({ pts, color: f.c, z: avgZ });
    }
  }

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    c.strokeStyle = "rgba(255, 200, 255, 0.4)";
    c.lineWidth = 0.8;
    c.stroke();
  });
  c.restore();
}

// ★ ロペ（LOPE）3D正12角形立体コア ＆ 正12角形リングデータ ＆ 描画関数
function create3DLopeCoreAndRingMesh() {
  let vertices = [];
  let faces = [];

  const sides = 12;

  const rCoreTop = 3.8;
  const rCoreMid = 7.8;
  const rCoreBase = 8.5;

  const zCoreTop = 5.5;
  const zCoreMid = 3.0;
  const zCoreBase = 1.0;

  let cStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreTop, y: Math.sin(a) * rCoreTop, z: zCoreTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreMid, y: Math.sin(a) * rCoreMid, z: zCoreMid });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rCoreBase, y: Math.sin(a) * rCoreBase, z: zCoreBase });
  }

  let coreTopV = [];
  for (let i = 0; i < sides; i++) coreTopV.push(cStart + i);
  faces.push({ v: coreTopV, color: '#ffea80', stroke: '#ffffff', layer: 0 });

  for (let i = 0; i < sides; i++) {
    let t1 = cStart + i;
    let t2 = cStart + ((i + 1) % sides);
    let m1 = cStart + sides + i;
    let m2 = cStart + sides + ((i + 1) % sides);
    let c = (i % 2 === 0) ? '#ffaa00' : '#ff8800';
    faces.push({ v: [t1, t2, m2, m1], color: c, stroke: '#ffd580', layer: 0 });
  }

  for (let i = 0; i < sides; i++) {
    let m1 = cStart + sides + i;
    let m2 = cStart + sides + ((i + 1) % sides);
    let b1 = cStart + sides * 2 + i;
    let b2 = cStart + sides * 2 + ((i + 1) % sides);
    let c = (i % 2 === 0) ? '#e67700' : '#cc5500';
    faces.push({ v: [m1, m2, b2, b1], color: c, stroke: '#ffaa00', layer: 0 });
  }

  const rRingIn = 10.2;
  const rRingOut = 16.5;
  const zRingTop = 2.5;
  const zRingBase = 0.0;

  let rStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rRingIn, y: Math.sin(a) * rRingIn, z: zRingTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides - Math.PI / 2;
    vertices.push({ x: Math.cos(a) * rRingOut, y: Math.sin(a) * rRingOut, z: zRingBase });
  }

  for (let i = 0; i < sides; i++) {
    let in1 = rStart + i;
    let in2 = rStart + ((i + 1) % sides);
    let out1 = rStart + sides + i;
    let out2 = rStart + sides + ((i + 1) % sides);
    let isAlt = i % 2 === 0;
    let c = isAlt ? '#00aaff' : '#0066cc';
    faces.push({ v: [in1, in2, out2, out1], color: c, stroke: '#80d4ff', layer: 1 });
  }

  return { vertices, faces };
}

const LOPE_3D_MESH = create3DLopeCoreAndRingMesh();

function draw3DLope(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 28.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = LOPE_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = LOPE_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke) {
      c.strokeStyle = f.stroke;
      c.lineWidth = 0.8;
      c.stroke();
    }
  });
  c.restore();
}

// ★ パタータ（PATARTA）底面水平 3Dデータ ＆ 描画関数
function createHorizontalPatartaMesh() {
  let vertices = [];
  let faces = [];

  const zFront = 4.0;

  function addV(x, y, z) {
    vertices.push({ x, y, z });
    return vertices.length - 1;
  }

  const outerX = 18.0;
  const innerX = 5.5;

  let vLT_out = addV(-outerX, -18, zFront);
  let vLT_in  = addV(-innerX, -18, zFront);
  let vRT_in  = addV( innerX, -18, zFront);
  let vRT_out = addV( outerX, -18, zFront);

  const slitBottomY = 2.0;

  let vLM_out = addV(-outerX, slitBottomY, zFront);
  let vLM_in  = addV(-innerX, slitBottomY, zFront);
  let vRM_in  = addV( innerX, slitBottomY, zFront);
  let vRM_out = addV( outerX, slitBottomY, zFront);

  const bottomSegs = 8;
  let bOutIdx = [];
  for (let i = 0; i <= bottomSegs; i++) {
    let angle = (i / bottomSegs) * Math.PI;
    let cosA = -Math.cos(angle);
    let sinA = Math.sin(angle);
    bOutIdx.push(addV(cosA * outerX, sinA * outerX * 0.9 + slitBottomY, zFront));
  }

  faces.push({ v: [vLT_out, vLT_in, vLM_in, vLM_out], color: '#d9f580', stroke: '#ffffff', zOffset: 0 });
  faces.push({ v: [vRT_in, vRT_out, vRM_out, vRM_in], color: '#d9f580', stroke: '#ffffff', zOffset: 0 });

  for (let i = 0; i < bottomSegs; i++) {
    let o1 = bOutIdx[i], o2 = bOutIdx[i+1];
    let c = (i % 2 === 0) ? '#ccff33' : '#b8e62e';
    faces.push({ v: [o1, o2, vRM_in, vLM_in], color: c, stroke: '#ffffff', zOffset: 0 });
  }

  let vL_d1 = addV(-16, -14, zFront + 1.2);
  let vL_d2 = addV(-innerX - 1.5, -14, zFront + 1.2);
  let vL_d3 = addV(-innerX - 1.5,  -2, zFront + 1.2);
  let vL_d4 = addV(-16,  -2, zFront + 1.2);
  faces.push({ v: [vL_d1, vL_d2, vL_d3, vL_d4], color: '#99cc00', stroke: '#ffffff', zOffset: 2 });

  let vR_d1 = addV( innerX + 1.5, -14, zFront + 1.2);
  let vR_d2 = addV( 16, -14, zFront + 1.2);
  let vR_d3 = addV( 16,  -2, zFront + 1.2);
  let vR_d4 = addV( innerX + 1.5,  -2, zFront + 1.2);
  faces.push({ v: [vR_d1, vR_d2, vR_d3, vR_d4], color: '#99cc00', stroke: '#ffffff', zOffset: 2 });

  const zCore = zFront + 2.0;

  let vP1 = addV(-innerX, slitBottomY, zCore);
  let vP2 = addV( innerX, slitBottomY, zCore);
  let vP3 = addV( innerX, slitBottomY + 7.0, zCore);
  let vP4 = addV(-innerX, slitBottomY + 7.0, zCore);

  faces.push({ v: [vP1, vP2, vP3, vP4], color: '#ffffff', stroke: '#99ff33', zOffset: 4 });

  let vPB1 = addV(-innerX, slitBottomY, zFront + 0.5);
  let vPB2 = addV( innerX, slitBottomY, zFront + 0.5);
  faces.push({ v: [vP1, vP2, vPB2, vPB1], color: '#77aa00', stroke: '#b8e62e', zOffset: 3 });

  let vGun1 = addV(-2.2, slitBottomY + 2.0, zCore + 0.3);
  let vGun2 = addV( 2.2, slitBottomY + 2.0, zCore + 0.3);
  let vGun3 = addV( 2.2, slitBottomY + 5.5, zCore + 0.3);
  let vGun4 = addV(-2.2, slitBottomY + 5.5, zCore + 0.3);
  faces.push({ v: [vGun1, vGun2, vGun3, vGun4], color: '#1a2b00', stroke: '#99ff33', zOffset: 5 });

  return { vertices, faces };
}

const PATARTA_3D_MESH = createHorizontalPatartaMesh();

function draw3DPatarta(c, w, h, baseColor) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 36.0;

  let transformed = PATARTA_3D_MESH.vertices.map(v => {
    return { x: v.x * scale, y: v.y * scale, z: v.z };
  });

  let renderFaces = PATARTA_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length + (f.zOffset || 0);
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke) {
      c.strokeStyle = f.stroke;
      c.lineWidth = 0.8;

}

// ★ ジラール（GIRARD）超濃色パープル 3Dデータ ＆ 描画関数
function createDarkPurpleGirardMesh() {
  let vertices = [];
  let faces = [];

  const sides = 12;
  const rCoreTop = 4.0;
  const rCoreBase = 8.5;
  const zTop = 5.0;
  const zBase = 1.0;

  let cStart = vertices.length;

  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rCoreTop, y: Math.sin(a) * rCoreTop, z: zTop });
  }
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2) / sides;
    vertices.push({ x: Math.cos(a) * rCoreBase, y: Math.sin(a) * rCoreBase, z: zBase });
  }

  let topV = [];
  for (let i = 0; i < sides; i++) topV.push(cStart + i);
  faces.push({ v: topV, color: '#aa33ff', stroke: '#ff88ff', layer: 0 });

  for (let i = 0; i < sides; i++) {
    let t1 = cStart + i;
    let t2 = cStart + ((i + 1) % sides);
    let b1 = cStart + sides + i;
    let b2 = cStart + sides + ((i + 1) % sides);

    let c = (i % 2 === 0) ? '#440066' : '#220033';
    faces.push({ v: [t1, t2, b2, b1], color: c, stroke: '#9922dd', layer: 0 });
  }

  const armLenInner = 8.0;
  const armLenOuter = 16.0;
  const armW = 1.2;
  const bladeL = 7.0;
  const bladeW = 1.8;
  const zArm = 2.5;

  for (let i = 0; i < 4; i++) {
    let baseAngle = (i * Math.PI) / 2;
    let cosA = Math.cos(baseAngle);
    let sinA = Math.sin(baseAngle);

    let perpX = -sinA;
    let perpY = cosA;

    let aIdx = vertices.length;
    vertices.push({ x: cosA * armLenInner - perpX * armW, y: sinA * armLenInner - perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenInner + perpX * armW, y: sinA * armLenInner + perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenOuter + perpX * armW, y: sinA * armLenOuter + perpY * armW, z: zArm });
    vertices.push({ x: cosA * armLenOuter - perpX * armW, y: sinA * armLenOuter - perpY * armW, z: zArm });

    faces.push({ v: [aIdx, aIdx + 1, aIdx + 2, aIdx + 3], color: '#150025', stroke: '#661199', layer: 1 });

    let bIdx = vertices.length;
    let bx = cosA * armLenOuter;
    let by = sinA * armLenOuter;

    vertices.push({ x: bx - perpX * bladeL, y: by - perpY * bladeL, z: zArm + 0.5 });
    vertices.push({ x: bx + perpX * bladeL, y: by + perpY * bladeL, z: zArm + 0.5 });
    vertices.push({ x: bx + cosA * bladeW + perpX * bladeL, y: by + sinA * bladeW + perpY * bladeL, z: zArm });
    vertices.push({ x: bx + cosA * bladeW - perpX * bladeL, y: by + sinA * bladeW - perpY * bladeL, z: zArm });

    faces.push({ v: [bIdx, bIdx + 1, bIdx + 2, bIdx + 3], color: '#cc00ff', stroke: '#ffaa00', layer: 2 });
  }

  return { vertices, faces };
}

const GIRARD_3D_MESH = createDarkPurpleGirardMesh();

function draw3DGirard(c, w, h, baseColor, rotZAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  let scale = w / 32.0;
  let rotZ = rotZAnim || 0;

  let cosZ = Math.cos(rotZ);
  let sinZ = Math.sin(rotZ);

  let transformed = GIRARD_3D_MESH.vertices.map(v => {
    let rx = v.x * cosZ - v.y * sinZ;
    let ry = v.x * sinZ + v.y * cosZ;
    return { x: rx * scale, y: ry * scale, z: v.z };
  });

  let renderFaces = GIRARD_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length + f.layer * 10;
    return { pts, color: f.color, stroke: f.stroke, z: avgZ };
  });

  renderFaces.sort((a, b) => a.z - b.z);

  renderFaces.forEach(f => {
    c.beginPath();
    c.moveTo(f.pts[0].x, f.pts[0].y);
    for (let i = 1; i < f.pts.length; i++) c.lineTo(f.pts[i].x, f.pts[i].y);
    c.closePath();
    c.fillStyle = f.color;
    c.fill();
    if (f.stroke) {
      c.strokeStyle = f.stroke;
      c.lineWidth = 0.8;
      c.stroke();
    }
  });
  c.restore();
}

  c.save();

  let scale = w / 32.0;
  let cameraDist = 350;
  let rotX = 0.45;
  let rotY = rotYAnim || 0;

  let cosY = Math.cos(rotY), sinY = Math.sin(rotY);
  let cosX = Math.cos(rotX), sinX = Math.sin(rotX);

  let transformed = QUIRI_3D_MESH.vertices.map(v => {
    let x1 = v.x * cosY + v.z * sinY;
    let z1 = -v.x * sinY + v.z * cosY;
    let y2 = v.y * cosX - z1 * sinX;
    let z2 = v.y * sinX + z1 * cosX;
    let perspective = cameraDist / (cameraDist + z2 + 100);
    return { x: x1 * scale * perspective, y: y2 * scale * perspective, z: z2 };
  });

  let renderFaces = QUIRI_3D_MESH.faces.map(f => {
    let pts = f.v.map(idx => transformed[idx]);
    let avgZ = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
    return { pts, color: f.c, z: avgZ };
  });

  renderFaces.sort((a, b) => b.z - a.z);

  renderFaces.forEach(f => {

    c.moveTo(f.pts[0].x, f.pts[0].y);

  });

}

// ★ ティッタ（TITTA）超軽量描画
function draw2D3DStyleTitta(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w / 2;
  c.beginPath();
  c.arc(0, 0, r, 0, Math.PI * 2);
  let sphereGrad = c.createRadialGradient(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.3, baseColor || '#00e5ff');
  sphereGrad.addColorStop(0.85, '#0088cc');
  sphereGrad.addColorStop(1, '#004466');
  c.fillStyle = sphereGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  c.lineWidth = 1;
  c.stroke();

  let gw = r * 0.28;
  c.fillStyle = '#111e2e';
  c.fillRect(-r, -gw / 2, r * 2, gw);
  c.fillRect(-gw / 2, -r, gw, r * 2);

  c.fillStyle = 'rgba(0, 0, 0, 0.6)';
  c.fillRect(-r, -gw / 2, r * 2, 2);
  c.fillRect(-gw / 2, -r, 2, r * 2);

  c.fillStyle = 'rgba(255, 255, 255, 0.35)';
  c.fillRect(-r, gw / 2 - 1.5, r * 2, 1.5);
  c.fillRect(gw / 2 - 1.5, -r, 1.5, r * 2);

  const margin = gw / 2 + 0.5;
  const pSize = r - margin;

  function drawDomePanel(xSign, ySign) {
    c.save();
    c.beginPath();
    let px = xSign * margin;
    let py = ySign * margin;
    c.moveTo(px, py);
    c.lineTo(px + xSign * pSize, py);
    c.arc(0, 0, r - 0.5, Math.atan2(py, px + xSign * pSize), Math.atan2(py + ySign * pSize, px), (xSign * ySign < 0));
    c.lineTo(px, py + ySign * pSize);
    c.closePath();

    let pGrad = c.createRadialGradient(xSign * r * 0.3, ySign * r * 0.3, r * 0.05, 0, 0, r);
    pGrad.addColorStop(0, '#ffffff');
    pGrad.addColorStop(0.35, baseColor || '#00e5ff');
    pGrad.addColorStop(0.85, '#0088cc');
    pGrad.addColorStop(1, '#004477');

    c.fillStyle = pGrad;
    c.fill();
    c.strokeStyle = 'rgba(255, 255, 255, 0.4)';
    c.lineWidth = 0.8;
    c.stroke();
    c.restore();
  }

  drawDomePanel(1, -1);
  drawDomePanel(-1, -1);
  drawDomePanel(-1, 1);
  drawDomePanel(1, 1);

  c.beginPath();
  c.arc(0, 0, gw * 0.8, 0, Math.PI * 2);
  c.fillStyle = '#223344';
  c.fill();
  c.strokeStyle = '#00ffff';
  c.lineWidth = 1;
  c.stroke();

  c.beginPath();
  c.arc(0, 0, gw * 0.35, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();

  c.restore();
}

// ★ ゾフ（ZOFF）描画

  c.ellipse(0, -r * 0.25, r * 0.1, r * 0.25, 0, 0, Math.PI * 2);

  c.restore();
}

// ★ メーウス（MEEUWS）描画
function draw2D3DStyleMeeuws(c, w, h, baseColor) {
  c.save();
  c.translate(w / 2, h / 2);

  let r = w / 2;
  let mainColor = baseColor || '#00ccff';

  let uWidth = r * 0.26;
  let uDepth = r * 0.40;
  let uYStart = -r * 0.88;

  let coreR = r * 0.22;
  let coreCY = -r * 0.02;

  c.save();
  c.beginPath();
  c.arc(0, coreCY, coreR * 1.35, 0, Math.PI * 2);
  c.fillStyle = '#050810';
  c.fill();

  c.shadowBlur = 15;
  c.shadowColor = '#ff6600';

  c.beginPath();
  c.arc(0, coreCY, coreR, 0, Math.PI * 2);

  let sphereGrad = c.createRadialGradient(-coreR * 0.35, coreCY - coreR * 0.35, coreR * 0.05, 0, coreCY, coreR);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.25, '#ffff00');
  sphereGrad.addColorStop(0.65, '#ff5500');
  sphereGrad.addColorStop(1, '#881100');

  c.fillStyle = sphereGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 200, 150, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, coreCY - coreR * 0.3, coreR * 0.25, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.save();
  c.beginPath();

  let startAngle = Math.atan2(uYStart, -uWidth);
  let endAngle = Math.atan2(uYStart, uWidth);

  c.arc(0, 0, r * 0.88, endAngle, startAngle, false);
  c.lineTo(-uWidth, uYStart);                       
  c.lineTo(-uWidth, uDepth - r * 0.15);              
  c.arc(0, uDepth - r * 0.15, uWidth, Math.PI, 0, true); 
  c.lineTo(uWidth, uYStart);                        
  c.closePath();

  let outerGrad = c.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.02, 0, 0, r * 0.95);
  outerGrad.addColorStop(0, '#ffffff');
  outerGrad.addColorStop(0.2, '#aaffff');
  outerGrad.addColorStop(0.48, mainColor);
  outerGrad.addColorStop(0.82, '#004488');
  outerGrad.addColorStop(1, '#001122');

  c.fillStyle = outerGrad;
  c.fill();

  c.strokeStyle = 'rgba(255, 255, 255, 0.75)';
  c.lineWidth = 1.5;
  c.stroke();
  c.restore();

  c.save();
  c.beginPath();
  c.arc(0, uDepth - r * 0.15, uWidth, 0, Math.PI, false);
  c.strokeStyle = 'rgba(0, 0, 0, 0.7)';
  c.lineWidth = 2.5;
  c.stroke();

  c.fillStyle = 'rgba(0, 10, 25, 0.6)';
  c.fillRect(-uWidth, uYStart, r * 0.06, uDepth + r * 0.1);
  c.restore();

  c.save();
  c.strokeStyle = 'rgba(0, 0, 0, 0.5)';
  c.lineWidth = 2;
  c.beginPath();
  c.arc(0, 0, r * 0.68, Math.PI * 0.22, Math.PI * 0.38, false);
  c.stroke();

  c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  c.lineWidth = 1;
  c.beginPath();
  c.arc(0, 0, r * 0.72, Math.PI * 0.23, Math.PI * 0.37, false);
  c.stroke();
  c.restore();

  c.restore();
}

// ★ オブセス（OBSESS）描画
function draw2D3DStyleObsess(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w * 0.45;
  let mainColor = baseColor || '#ff00ff';

  let topGrad = c.createLinearGradient(0, -r, 0, 0);
  topGrad.addColorStop(0, '#ffffff');
  topGrad.addColorStop(1, mainColor);
  c.beginPath();
  c.moveTo(0, -r); c.lineTo(r, 0); c.lineTo(0, 0); c.lineTo(-r, 0);
  c.closePath();
  c.fillStyle = topGrad;
  c.fill();

  let bottomGrad = c.createLinearGradient(0, 0, 0, r);
  bottomGrad.addColorStop(0, mainColor);
  bottomGrad.addColorStop(1, '#550055');
  c.beginPath();
  c.moveTo(-r, 0); c.lineTo(0, 0); c.lineTo(r, 0); c.lineTo(0, r);
  c.closePath();
  c.fillStyle = bottomGrad;
  c.fill();

  c.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  c.lineWidth = 1.2;
  c.beginPath();
  c.moveTo(0, -r); c.lineTo(0, r);
  c.moveTo(-r, 0); c.lineTo(r, 0);
  c.stroke();
  c.restore();

  let rInner = r * 0.42;
  c.save();
  c.beginPath();
  c.moveTo(0, -rInner); c.lineTo(rInner, 0); c.lineTo(0, rInner); c.lineTo(-rInner, 0);
  c.closePath();

  let innerGrad = c.createRadialGradient(0, 0, rInner * 0.1, 0, 0, rInner);
  innerGrad.addColorStop(0, '#ffffff');

  c.lineWidth = 1;
  c.stroke();
  c.restore();

  let coreR = r * 0.18;
  c.save();
  c.beginPath();
  c.arc(0, 0, coreR, 0, Math.PI * 2);

  let coreGrad = c.createRadialGradient(-coreR * 0.3, -coreR * 0.3, coreR * 0.1, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, '#ffff00');
  coreGrad.addColorStop(1, '#ff0055');

  c.fillStyle = coreGrad;
  c.fill();
  c.strokeStyle = '#ffffff';
  c.lineWidth = 1;
  c.stroke();

  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.3, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.restore();

// ★ リーバ（RIVA）描画
function createOctagonPath(c, r) {
  c.beginPath();
  for (let i = 0; i < 8; i++) {
    let a = (i * Math.PI / 4) + (Math.PI / 8);
    let x = Math.cos(a) * r;
    let y = Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y);
    else c.lineTo(x, y);
  }
  c.closePath();
}

function draw2D3DStyleRiva(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w * 0.44;
  let mainColor = baseColor || '#ffff00';

  c.save();
  createOctagonPath(c, r);

  let sphereGrad = c.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  sphereGrad.addColorStop(0, '#ffffff');
  sphereGrad.addColorStop(0.35, mainColor);
  sphereGrad.addColorStop(0.8, '#cc9900');
  sphereGrad.addColorStop(1, '#442200');

  c.fillStyle = sphereGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 200, 0.7)';
  c.lineWidth = 1.2;
  c.stroke();
  c.restore();

  let bandW = r * 0.40;

  c.save();
  createOctagonPath(c, r);
  c.clip();

  c.beginPath();
  c.rect(-bandW / 2, -r, bandW, r * 2);
  c.rect(-r, -bandW / 2, r * 2, bandW);

  let bandGrad = c.createLinearGradient(-r, -r, r, r);
  bandGrad.addColorStop(0, '#ffffff');
  bandGrad.addColorStop(0.3, '#ffffaa');
  bandGrad.addColorStop(0.7, mainColor);
  bandGrad.addColorStop(1, '#885500');

  c.fillStyle = bandGrad;
  c.fill();

  c.fillStyle = 'rgba(255, 255, 255, 0.7)';
  c.fillRect(-bandW / 2, -r, 1.5, r * 2);
  c.fillRect(-r, -bandW / 2, r * 2, 1.5);

  c.fillStyle = 'rgba(0, 0, 0, 0.5)';
  c.fillRect(bandW / 2 - 1.5, -r, 1.5, r * 2);
  c.fillRect(-r, bandW / 2 - 1.5, r * 2, 1.5);

  c.restore();

  let coreR = bandW * 0.38;
  c.save();
  c.beginPath();
  c.arc(0, 0, coreR, 0, Math.PI * 2);

  let coreGrad = c.createRadialGradient(-coreR * 0.3, -coreR * 0.3, coreR * 0.05, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.4, '#ffdd00');
  coreGrad.addColorStop(0.8, '#ff5500');
  coreGrad.addColorStop(1, '#441100');

  c.fillStyle = coreGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.25, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.restore();
}

// ★ ネイラ（NEIRA）描画
function drawPolygonPath(c, r, sides) {
  c.beginPath();
  for (let i = 0; i < sides; i++) {
    let a = (i * Math.PI * 2 / sides) - Math.PI / 2;
    let x = Math.cos(a) * r;
    let y = Math.sin(a) * r;
    if (i === 0) c.moveTo(x, y);
    else c.lineTo(x, y);
  }
  c.closePath();
}

function draw2D3DStyleNeira(c, w, h, baseColor, rotYAnim) {
  c.save();
  c.translate(w / 2, h / 2);
  c.rotate(rotYAnim || 0);

  let r = w * 0.42;
  let mainColor = baseColor || '#00ffcc';

  c.save();
  let sqSize = r * 0.95;
  c.shadowBlur = 12;
  c.shadowColor = mainColor;

  let sqGrad = c.createLinearGradient(-sqSize, -sqSize, sqSize, sqSize);
  sqGrad.addColorStop(0, '#ffffff');
  sqGrad.addColorStop(0.3, mainColor);
  sqGrad.addColorStop(0.85, '#0055aa');
  sqGrad.addColorStop(1, '#001133');

  c.fillStyle = sqGrad;
  c.fillRect(-sqSize, -sqSize, sqSize * 2, sqSize * 2);
  c.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  c.lineWidth = 1.2;
  c.strokeRect(-sqSize, -sqSize, sqSize * 2, sqSize * 2);
  c.restore();

  let r12Outer = r * 0.82;
  c.save();
  drawPolygonPath(c, r12Outer, 12);

  let outerGrad = c.createRadialGradient(-r12Outer * 0.3, -r12Outer * 0.3, r12Outer * 0.1, 0, 0, r12Outer);
  outerGrad.addColorStop(0, '#ffffff');
  outerGrad.addColorStop(0.4, '#00ccff');
  outerGrad.addColorStop(1, '#002266');

  c.fillStyle = outerGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.8)';
  c.lineWidth = 1;
  c.stroke();
  c.restore();

  let r12Inner = r * 0.58;
  c.save();
  drawPolygonPath(c, r12Inner, 12);

  let innerGrad = c.createRadialGradient(0, 0, r12Inner * 0.1, 0, 0, r12Inner);
  innerGrad.addColorStop(0, '#001122');
  innerGrad.addColorStop(0.7, '#003366');
  innerGrad.addColorStop(1, '#0088ff');

  c.fillStyle = innerGrad;
  c.fill();
  c.strokeStyle = 'rgba(0, 255, 255, 0.9)';
  c.lineWidth = 1;
  c.stroke();
  c.restore();

  c.save();
  let slotW = r * 0.22;
  let slotL = r * 0.28;
  c.fillStyle = '#002244';
  c.strokeStyle = 'rgba(255, 255, 255, 0.5)';
  c.lineWidth = 1;

  for (let i = 0; i < 4; i++) {
    c.save();
    c.rotate(i * Math.PI / 2);
    c.fillRect(-slotW / 2, -r12Inner + r * 0.05, slotW, slotL);
    c.strokeRect(-slotW / 2, -r12Inner + r * 0.05, slotW, slotL);

    c.fillStyle = '#00ffff';
    c.fillRect(-slotW * 0.3, -r12Inner + r * 0.1, slotW * 0.6, r * 0.04);
    c.restore();
  }
  c.restore();

  let coreR = r * 0.22;
  c.save();
  c.beginPath();
  c.arc(0, 0, coreR, 0, Math.PI * 2);

  let coreGrad = c.createRadialGradient(-coreR * 0.3, -coreR * 0.3, coreR * 0.05, 0, 0, coreR);
  coreGrad.addColorStop(0, '#ffffff');
  coreGrad.addColorStop(0.3, '#88ffff');
  coreGrad.addColorStop(0.75, '#0066ff');
  coreGrad.addColorStop(1, '#001144');

  c.shadowBlur = 12;
  c.shadowColor = '#00ffff';

  c.fillStyle = coreGrad;
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 255, 0.9)';
  c.lineWidth = 1;
  c.stroke();

  c.shadowBlur = 0;
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(-coreR * 0.3, -coreR * 0.3, coreR * 0.25, 0, Math.PI * 2);
  c.fill();
  c.restore();

  c.restore();
}

class PRNG {
  constructor(s) { this.seed = s % 2147483647; if (this.seed <= 0) this.seed += 2147483646; }
  next() { return this.seed = this.seed * 16807 % 2147483647; }
  nextFloat() { return (this.next() - 1) / 2147483646; }
}

function drawPoly(c, p, col, o = null) {
  c.beginPath(); c.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) c.lineTo(p[i][0], p[i][1]);
  c.closePath(); c.fillStyle = col; c.fill();
  if (o) { c.fillStyle = o; c.fill(); }
}

function drawBevel(c, tx, ty, tw, th, bc) {
  let bw = 6;
  drawPoly(c, [[tx, ty], [tx + tw, ty], [tx + tw - bw, ty + bw], [tx + bw, ty + bw]], bc, 'rgba(255,255,255,0.4)');
  drawPoly(c, [[tx, ty], [tx + bw, ty + bw], [tx + bw, ty + th - bw], [tx, ty + th]], bc, 'rgba(255,255,255,0.1)');
  drawPoly(c, [[tx + tw, ty], [tx + tw, ty + th], [tx + tw - bw, ty + th - bw], [tx + tw - bw, ty + bw]], bc, 'rgba(0,0,0,0.3)');
  drawPoly(c, [[tx, ty + th], [tx + bw, ty + th - bw], [tx + tw - bw, ty + th - bw], [tx + tw, ty + th]], bc, 'rgba(0,0,0,0.6)');
  drawPoly(c, [[tx + bw, ty + bw], [tx + tw - bw, ty + bw], [tx + tw - bw, ty + th - bw], [tx + bw, ty + th - bw]], bc);
}

function drawPolyDome(c, tx, ty, r, s, bc) {
  for (let i = 0; i < s; i++) {
    let a1 = i * Math.PI * 2 / s - Math.PI / 2, a2 = (i + 1) * Math.PI * 2 / s - Math.PI / 2;
    let br = -Math.sin((a1 + a2) / 2);
    let o = br > 0 ? `rgba(255,255,255,${br * 0.5})` : `rgba(0,0,0,${-br * 0.5})`;
    drawPoly(c, [[tx, ty], [tx + Math.cos(a1) * r, ty + Math.sin(a1) * r], [tx + Math.cos(a2) * r, ty + Math.sin(a2) * r]], bc, o);
  }
}

function drawDetailedEnemyShape(c, sh, col, w, h) {
  c.save();
  if (sh === 'delta') {
    drawPoly(c, [[w/2, 0], [w*0.8, h*0.4], [w/2, h*0.3]], col, 'rgba(255,255,255,0.4)');
    drawPoly(c, [[w/2, 0], [w*0.2, h*0.4], [w/2, h*0.3]], col, 'rgba(255,255,255,0.1)');
    drawPoly(c, [[w*0.8, h*0.4], [w, h*0.85], [w/2, h*0.65], [w/2, h*0.3]], col, 'rgba(0,0,0,0.2)');
    drawPoly(c, [[w*0.2, h*0.4], [0, h*0.85], [w/2, h*0.65], [w/2, h*0.3]], col, 'rgba(0,0,0,0.4)');
    drawPoly(c, [[w/2, h*0.65], [w*0.65, h*0.85], [w/2, h], [w*0.35, h*0.85]], col, 'rgba(255,255,255,0.2)');
  } else if (sh === 'stealth') {
    drawPoly(c, [[w/2, 0], [w*0.7, h*0.3], [w/2, h*0.5]], col, 'rgba(255,255,255,0.5)');
    drawPoly(c, [[w/2, 0], [w*0.3, h*0.3], [w/2, h*0.5]], col, 'rgba(255,255,255,0.2)');
    drawPoly(c, [[w*0.7, h*0.3], [w, h*0.2], [w*0.85, h*0.8], [w/2, h*0.5]], col, 'rgba(0,0,0,0.2)');
    drawPoly(c, [[w*0.3, h*0.3], [0, h*0.2], [w*0.15, h*0.8], [w/2, h*0.5]], col, 'rgba(0,0,0,0.4)');
    drawPoly(c, [[w/2, h*0.5], [w*0.7, h*0.8], [w/2, h], [w*0.3, h*0.8]], '#fff', 'rgba(0,0,0,0.3)');
  } else if (sh === 'arrow') {
    drawPoly(c, [[w*0.3, 0], [w/2, h*0.3], [0, h*0.6]], col, 'rgba(255,255,255,0.4)');
    drawPoly(c, [[w*0.7, 0], [w, h*0.6], [w/2, h*0.3]], col, 'rgba(0,0,0,0.2)');
    drawPoly(c, [[w/2, h*0.3], [w*0.8, h*0.6], [w*0.6, h], [w*0.4, h], [w*0.2, h*0.6]], col, 'rgba(255,255,255,0.1)');
  } else if (sh === 'heavy') {
    drawPoly(c, [[w*0.2, 0], [w*0.8, 0], [w, h*0.3], [w, h*0.7], [w*0.8, h], [w*0.2, h], [0, h*0.7], [0, h*0.3]], col);
    drawPoly(c, [[w*0.2, 0], [w*0.8, 0], [w/2, h*0.4]], col, 'rgba(255,255,255,0.4)');
    drawPoly(c, [[0, h*0.3], [w*0.2, 0], [w/2, h*0.4], [0, h*0.7]], col, 'rgba(255,255,255,0.1)');
    drawPoly(c, [[w, h*0.3], [w*0.8, 0], [w/2, h*0.4], [w, h*0.7]], col, 'rgba(0,0,0,0.3)');
    drawPoly(c, [[0, h*0.7], [w/2, h*0.4], [w, h*0.7], [w*0.8, h], [w*0.2, h]], col, 'rgba(0,0,0,0.5)');
  } else if (sh === 'cruiser') {
    drawPoly(c, [[w/2, 0], [w*0.85, h*0.2], [w*0.85, h*0.8], [w/2, h]], col, 'rgba(255,255,255,0.3)');
    drawPoly(c, [[w/2, 0], [w*0.15, h*0.2], [w*0.15, h*0.8], [w/2, h]], col, 'rgba(0,0,0,0.3)');
    drawPoly(c, [[0, h*0.3], [w*0.15, h*0.2], [w*0.15, h*0.8], [0, h*0.7]], col, 'rgba(255,255,255,0.2)');
    drawPoly(c, [[w, h*0.3], [w*0.85, h*0.2], [w*0.85, h*0.8], [w, h*0.7]], col, 'rgba(0,0,0,0.5)');
  } else if (sh === 'crescent') { 
    drawPolyDome(c, w/2, h/2, w*0.35, 12, col);
    drawPoly(c, [[w*0.1, h*0.2], [w*0.4, h*0.4], [w*0.2, h*0.8]], col, 'rgba(255,255,255,0.3)');
    drawPoly(c, [[w*0.9, h*0.2], [w*0.6, h*0.4], [w*0.8, h*0.8]], col, 'rgba(0,0,0,0.4)');
    c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.beginPath(); c.arc(w/2, h/2, w*0.2, 0, Math.PI*2); c.stroke();
  } else if (sh === 'scout') { 
    drawPoly(c, [[w/2, 0], [w, h*0.5], [w*0.7, h*0.9], [w/2, h*0.6]], col, 'rgba(255,255,255,0.4)');
    drawPoly(c, [[w/2, 0], [0, h*0.5], [w*0.3, h*0.9], [w/2, h*0.6]], col, 'rgba(0,0,0,0.4)');
    drawPolyDome(c, w/2, h*0.4, w*0.18, 8, '#ffffff');
  } else if (sh === 'dagger') { 
    drawPoly(c, [[w/2, 0], [w*0.7, h*0.7], [w/2, h]], col, 'rgba(255,255,255,0.45)');
    drawPoly(c, [[w/2, 0], [w*0.3, h*0.7], [w/2, h]], col, 'rgba(0,0,0,0.45)');
    drawPoly(c, [[w*0.3, h*0.7], [0, h*0.9], [w/2, h*0.85]], col, 'rgba(255,255,255,0.2)');
    drawPoly(c, [[w*0.7, h*0.7], [w, h*0.9], [w/2, h*0.85]], col, 'rgba(0,0,0,0.6)');
  } else if (sh === 'saucer') { 
    drawPolyDome(c, w/2, h/2, w*0.45, 16, col); drawPolyDome(c, w/2, h/2, w*0.25, 12, '#ffffff');
    c.strokeStyle = '#00ffff'; c.lineWidth = 2; c.beginPath(); c.ellipse(w/2, h/2, w*0.4, h*0.15, 0, 0, Math.PI*2); c.stroke();
  } else if (sh === 'sphere') {
    drawPolyDome(c, w/2, h/2, w/2, 12, col); c.strokeStyle = '#fff'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(w/2, h/2, w*0.6, h*0.2, Math.PI/4, 0, Math.PI*2); c.stroke();
  } else if (sh === 'star') {
    for (let i = 0; i < 6; i++) {
      let a1 = i * Math.PI / 3, a2 = (i + 1) * Math.PI / 3, o = (i > 2 && i < 5) ? 'rgba(0,0,0,0.4)' : (i < 2 ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0)');
      drawPoly(c, [[w / 2, h / 2], [w / 2 + Math.cos(a1) * w / 2, h / 2 + Math.sin(a1) * w / 2], [w / 2 + Math.cos(a2) * w / 2, h / 2 + Math.sin(a2) * w / 2]], col, o);
    }
  } else if (sh === 'mine') {
    for (let i = 0; i < 8; i++) {
      let a1 = i * Math.PI / 4, a2 = (i + 1) * Math.PI / 4, o = (i > 3 && i < 7) ? 'rgba(0,0,0,0.4)' : (i < 3 ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0)');
      drawPoly(c, [[w / 2, h / 2], [w / 2 + Math.cos(a1) * w * 0.4, h / 2 + Math.sin(a1) * w * 0.4], [w / 2 + Math.cos(a2) * w * 0.4, h / 2 + Math.sin(a2) * w * 0.4]], col, o);
    }
  } else if (sh === 'carrier') {
    drawPoly(c, [[w / 2, h / 2], [w * 0.2, 0], [w * 0.8, 0]], col, 'rgba(255,255,255,0.3)');
    drawPoly(c, [[w / 2, h / 2], [0, h / 2], [w * 0.2, 0]], col, 'rgba(255,255,255,0.1)');
    drawPoly(c, [[w / 2, h / 2], [w, h / 2], [w * 0.8, 0]], col, 'rgba(0,0,0,0.2)');
    drawPoly(c, [[w / 2, h / 2], [0, h / 2], [w / 2, h]], col, 'rgba(0,0,0,0.3)');
    drawPoly(c, [[w / 2, h / 2], [w, h / 2], [w / 2, h]], col, 'rgba(0,0,0,0.5)');
  }
  c.restore();
}

class SoundEngine {
  constructor() { this.ctx = null; this.bgmPhase = 'STOP'; this.bgmStep = 0; this.bgmFrameCount = 0; this.audioEnabled = false; this.noiseBuffer = null; }
  init() { try { if (!this.ctx) { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); const bSize = this.ctx.sampleRate * 2; this.noiseBuffer = this.ctx.createBuffer(1, bSize, this.ctx.sampleRate); const data = this.noiseBuffer.getChannelData(0); for (let i = 0; i < bSize; i++) data[i] = Math.random() * 2 - 1; } if (this.ctx.state === 'suspended') this.ctx.resume(); this.audioEnabled = true; } catch (e) {} }
  playTone(f, t, d, v = 0.1) { if (!this.audioEnabled || !this.ctx) return; try { const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime); g.gain.setValueAtTime(0, this.ctx.currentTime); g.gain.linearRampToValueAtTime(v, this.ctx.currentTime + 0.01); g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + d); o.connect(g); g.connect(this.ctx.destination); o.start(this.ctx.currentTime); o.stop(this.ctx.currentTime + d); } catch (e) {} }
  playNoise(d, v = 0.2) { if (!this.audioEnabled || !this.ctx || !this.noiseBuffer) return; try { const n = this.ctx.createBufferSource(); n.buffer = this.noiseBuffer; const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(800, this.ctx.currentTime); f.frequency.linearRampToValueAtTime(100, this.ctx.currentTime + d); const g = this.ctx.createGain(); g.gain.setValueAtTime(v, this.ctx.currentTime); g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + d); n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start(this.ctx.currentTime); n.stop(this.ctx.currentTime + d); } catch (e) {} }
  playLaser() { this.playTone(1400, 'sawtooth', 0.08, 0.04); } playEnemyLaser() { this.playTone(1800, 'square', 0.1, 0.02); } playHit() { this.playNoise(0.1, 0.08); } playExplosion() { this.playNoise(0.3, 0.3); }
  playHiddenAppear() { this.playTone(1046, 'sine', 0.08, 0.15); setTimeout(() => this.playTone(2093, 'sine', 0.15, 0.2), 60); } playHiddenDestroy() { [1318, 1567, 2093, 2637].forEach((f, i) => { setTimeout(() => this.playTone(f, 'triangle', 0.12, 0.2), i * 40); }); }
  playStart() { [880, 1760].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.1, 0.1), i * 100)); } playBonus() { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => this.playTone(f, 'square', 0.1, 0.15), i * 60)); } playSecretBonus() { [440, 554, 659, 880, 1108, 1318, 1760].forEach((f, i) => setTimeout(() => this.playTone(f, 'sawtooth', 0.15, 0.15), i * 80)); }

class Enemy {
  constructor(x, y, t, o = {}) {
    this.type = t; this.toRemove = false; this.lifeTime = 0; this.formationOffset = o.offset || 0;
    this.def = ENEMY_TYPES[t] || ENEMY_TYPES['GALLI'];
    this.pat = ENEMY_PATTERNS_DATA[t] || ENEMY_PATTERNS_DATA['GALLI'];
    this.hp = (t === 'GIRARD') ? 8 : (this.def.hp || 1); this.score = this.def.score || 100;
    this.isWeak = o.weak || false; this.isFast = o.fast || false;
    let sh = this.def.shape;
    this.width = (sh === 'carrier' || t === 'GUILER') ? 64 : (sh === 'heavy' || t === 'PATARTA' ? 36 : (sh === 'star' ? 16 : 28)); this.height = this.width;
    
    let effArea = isLooped ? 10 : Math.min(10, areaLevel);
    let bfm = effArea >= 5 ? Math.max(0.4, 1.0 - (effArea - 4) * 0.1) : 1.0;
    this.shotTimer = (sh === 'carrier' ? 60 : (80 + Math.random() * 30)) * (bfm / fireModifier); this.state = 'enter';

    if (this.type === 'RIVA' && player) {
      this.isFromLeft = Math.random() < 0.5; this.x = this.isFromLeft ? -40 : canvas.width + 10; this.y = -40; this.startX = this.x; this.startY = this.y;
    } else if (this.type === 'GUILER') {
      this.x = isNaN(x) ? canvas.width / 2 - 32 : x;
      this.y = canvas.height + 50;
      this.startX = this.x; this.startY = this.y;
    } else {
      this.x = isNaN(x) ? canvas.width / 2 : x; this.y = isNaN(y) ? -50 : y; this.startX = this.x; this.startY = this.y;
    }
  }
  
  update() {
    try {
      this.lifeTime++;
      let effArea = isLooped ? 10 : Math.min(10, areaLevel);
      let baseSpeed = this.pat.speed || 3;
      let spd = (baseSpeed / 3.0) * (1.0 + (effArea >= 5 ? (effArea - 4) * 0.05 : 0)) * (this.isFast ? 2.0 : 1.0);
      let cat = this.pat.category;
      let p = this.pat.params || {};

      if (this.type === 'GUILER') {
        this.y -= 1.2 * spd;
        this.x = this.startX + Math.sin(this.lifeTime * 0.04 + this.formationOffset) * 50;
        
        let normalEnemiesCount = enemies.filter(e => e.type !== 'GUILER').length;
        if (this.lifeTime % 30 === 0 && this.y > 80 && this.y < canvas.height - 80 && normalEnemiesCount < 16) {
          let currentQuiri = enemies.filter(e => e.type === 'QUIRI').length;
          if (currentQuiri < 8) {
            enemies.push(new Enemy(this.x + 24, this.y, 'QUIRI'));
          }
        }
      }
      else if (cat === 'swingby') {
        let trigY = p.swingByTriggerY || 400;
        let curve = p.swingByCurve || 0.06;
        if (this.state === 'enter') {
          this.y += 3.5 * spd;
          if (this.y >= trigY) {
            this.state = 'swing';
            this.swingAngle = 0;
          }
        } else if (this.state === 'swing') {
          this.swingAngle += curve;
          this.x += Math.sin(this.swingAngle) * 8.0 * spd;
          this.y -= Math.cos(this.swingAngle) * 4.0 * spd;
          if (this.swingAngle >= Math.PI) this.state = 'exit';
        } else {
          this.y -= 4.0 * spd;
        }
      }
      else if (cat === 'sine') {
        let amp = p.amplitude !== undefined ? p.amplitude : 60;
        let freq = p.frequency || 0.05;
        this.y += 2.5 * spd;
        this.x = this.startX + Math.sin(this.lifeTime * freq + this.formationOffset) * amp;
      } 
      else if (cat === 'turn') {
        let turnY = p.turnY || 480;
        let turnType = p.turnType || "u_turn";
        if (this.state === 'enter') {
          this.y += 3.5 * spd;
          if (this.y >= turnY) {
            this.state = 'turn';
            if (turnType === 'right_angle') {
              this.vx = (this.x < canvas.width / 2) ? 4.5 * spd : -4.5 * spd;
            } else {
              this.vx = (player && this.x < player.x) ? 3.0 * spd : -3.0 * spd;
            }
          }
        } else {
          if (turnType === 'right_angle') {
            this.x += this.vx;
          } else {
            this.x += this.vx;
            this.y -= 2.5 * spd;
          }
        }
      } 
      else if (cat === 'pause') {
        let pauseY = p.pauseY || 200;
        if (this.state === 'enter') {
          this.y += 3.0 * spd;
          if (this.y >= pauseY) {
            this.state = 'stop';
            this.stopTimer = 45;
          }
        } else if (this.state === 'stop') {
          this.stopTimer--;
          if (this.stopTimer <= 0) this.state = 'leave';
        } else if (this.state === 'leave') {
          this.y += 3.0 * spd;
        }
      }
      else if (cat === 'dive') {
        if (this.lifeTime === 1 && player) {
          let a = Math.atan2(player.y - this.y, player.x - this.x);
          this.vx = Math.cos(a) * 6.5 * spd;
          this.vy = Math.sin(a) * 6.5 * spd;
        }
        this.x += this.vx || 0;
        this.y += this.vy || (6.5 * spd);
      }
      else if (cat === 'special' && p.path && p.path.length > 0) {
        let t = (this.lifeTime * 0.01) % p.path.length;
        let idx = Math.floor(t);
        let nextIdx = (idx + 1) % p.path.length;
        let factor = t - idx;
        let p1 = p.path[idx], p2 = p.path[nextIdx];
        this.x = p1.x + (p2.x - p1.x) * factor;
        this.y = p1.y + (p2.y - p1.y) * factor;
      }
      else {
        this.y += 2.5 * spd;
      }

      if (this.type !== 'RIVA') {
        if (this.y > canvas.height + 80 || this.y < -150 || this.x < -150 || this.x > canvas.width + 150) {
          this.toRemove = true;
        }
      }

      let isInScreen = (this.x >= 0 && this.x + this.width <= canvas.width && this.y >= 0 && this.y + this.height <= canvas.height);

      if (!this.isWeak && player && !isNaN(player.x) && !isNaN(player.y) && enemyBullets.length < 15 && !player.isDestroyed) {
        if (!(gameState === 'PLAYING' && areaFrames >= 3900)) {
          this.shotTimer--;
          if (this.shotTimer <= 0 && isInScreen) {
            let cx = this.x + this.width / 2, cy = this.y + this.height / 2;
            let bs = 1.0 + (effArea >= 5 ? (effArea - 4) * 0.1 : 0);
            let bfm = effArea >= 5 ? Math.max(0.4, 1.0 - (effArea - 4) * 0.1) : 1.0;
            if (this.type !== 'GADOHA' && this.type !== 'PATARTA') {
              enemyBullets.push(new EnemyBullet(cx, cy, player.x + 16, player.y + 20, bs));
              this.shotTimer = (80 + Math.random() * 60) * (bfm / fireModifier);
            }
          }
        }
      }
    } catch (e) { this.toRemove = true; }
  }
  
  draw() { 
    try { 
      if (isNaN(this.x) || isNaN(this.y)) return; 
      ctx.save(); 
      ctx.translate(this.x, this.y); 
      let c = this.def.color || '#ffffff'; 
      ctx.shadowBlur = 15; 
      ctx.shadowColor = c; 
      
      // ★ 敵キャラ3D/スタイリッシュ描画分岐 (PATARTA 3Dを新規組み込み)
      if (this.type === 'GALLI') {
        draw3DGalli(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'TITTA') {
        draw2D3DStyleTitta(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'ZOFF') {
        draw2D3DStyleZoff(ctx, this.width, this.height, c);
      } else if (this.type === 'FAILLAR') {
        draw2D3DStyleFaillar(ctx, this.width, this.height, c);
      } else if (this.type === 'MEEUWS') {
        draw2D3DStyleMeeuws(ctx, this.width, this.height, c);
      } else if (this.type === 'OBSESS') {
        draw2D3DStyleObsess(ctx, this.width, this.height, c, -this.lifeTime * 0.05);
      } else if (this.type === 'RIVA') {
        draw2D3DStyleRiva(ctx, this.width, this.height, '#ffff00', -this.lifeTime * 0.05);
      } else if (this.type === 'NEIRA') {
        draw2D3DStyleNeira(ctx, this.width, this.height, '#00ffcc', -this.lifeTime * 0.05);
      } else if (this.type === 'ETTORI') {
        draw3DEttori(ctx, this.width, this.height, c, -this.lifeTime * 0.04);
      } else if (this.type === 'LOPE') {
        draw3DLope(ctx, this.width, this.height, c, -this.lifeTime * 0.04);
      } else if (this.type === 'GIRARD') {
        draw3DGirard(ctx, this.width, this.height, '#cc00ff', -this.lifeTime * 0.03);
      } else if (this.type === 'QUIRI') {
        draw3DQuiri(ctx, this.width, this.height, '#ff3333', this.lifeTime * 0.04);
      } else if (this.type === 'SPLITTA') {
        draw3DSplitta(ctx, this.width, this.height, c, -this.lifeTime * 0.03);
      } else if (this.type === 'PATARTA') {
        draw3DPatarta(ctx, this.width, this.height, c);
      } else {

      }
      ctx.restore(); 
    } catch (e) {} 
  }
}

function spawnWaveFromSequence() {
  if (gameFrames % Math.floor(130 / spawnModifier) !== 0) return;

  if (!lariosSpawnedThisArea && !lariosBoss && areaFrames >= 1800) {
    lariosBoss = new Larios();
    lariosSpawnedThisArea = true;
    return;
  }

  let normalEnemiesCount = enemies.filter(e => e.type !== 'GUILER').length;
  if (normalEnemiesCount >= 16) return;

  let cw = ENEMY_SEQUENCE[sequenceIndex % ENEMY_SEQUENCE.length]; sequenceIndex++;
  
  if (cw.type === 'LARIOS') {
    if (!lariosSpawnedThisArea && !lariosBoss) {
      lariosBoss = new Larios();
      lariosSpawnedThisArea = true;
    }
    return;
  }

  let sameTypeCount = enemies.filter(e => e.type === cw.type).length; 
  let maxCanSpawn = (cw.type === 'GUILER') ? 2 : Math.min(8 - sameTypeCount, 16 - normalEnemiesCount); 
  if (maxCanSpawn <= 0) return;

  let ct = Math.min(maxCanSpawn, Math.max(1, Math.floor(cw.count * spawnModifier))); 
  let formationType = Math.floor(Math.random() * 4); 
  let baseSx = 60 + Math.random() * (canvas.width - 120);
  
  if (cw.type === 'GALLI' || cw.type === 'SULTAN') { 
    baseSx = (player && player.x > canvas.width / 2) ? 20 + Math.random() * 100 : canvas.width - 120 + Math.random() * 100; 
  } else if (cw.type === 'NEIRA' && player) { 
    baseSx = player.x > canvas.width / 2 ? 20 + Math.random() * 50 : canvas.width - 70 + Math.random() * 50; 
  }

  for (let i = 0; i < ct; i++) {
    let sx = baseSx; 
    let sy = (cw.type === 'GUILER') ? canvas.height + 50 : -50;
    if (formationType === 0) { sy -= i * 25; } 
    else if (formationType === 1) { sx = 40 + (i * 35) % (canvas.width - 80); sy = -50 - Math.floor(i / 8) * 30; } 
    else if (formationType === 2) { let mid = Math.floor(ct / 2); sx = baseSx + (i - mid) * 30; sy = -50 - Math.abs(i - mid) * 20; } 
    else if (formationType === 3) { sx = baseSx + i * 20; sy = -50 - i * 20; }
    sx = Math.max(20, Math.min(canvas.width - 20, sx));
    enemies.push(new Enemy(sx, sy, cw.type, { offset: i * 0.4, weak: cw.weak, dense: cw.dense, fast: cw.fast }));
  }
}

function addScore(pts) { 
  score = Math.min(99999999, score + pts); 
  if (score >= nextExtendScore) {
    lives++; 
    audio.playExtend();
    
    extendAnimState = 'IN';
    extendTextX = canvas.width + 100;
    extendAnimFrame = 0;

    if (nextExtendScore === 500000) {
      nextExtendScore = 2000000;
    } else {
      nextExtendScore += 2000000;
    }
  }
}

function handlePlayerHit() {
  if (!player || player.isDestroyed || player.invincibleTimer > 0 || player.isInvincible) return;

  player.isDestroyed = true;
  audio.playExplosion();
  explosions.push(new Explosion(player.x + 16, player.y + 20, '#ff2200', true));
  spawnDebris(player.x + 16, player.y + 20, '#ffaa00', 25, 50);

  if (lives > 0) {
    lives--; 
    respawnTimer = 60; 
  } else {
    setTimeout(() => {
      processGameOver();
    }, 1000);
  }
}

      titleTimer++; gameFrames++;
      if (gameState === 'TITLE' && titleTimer > 400) { gameState = 'HIGHSCORE'; titleTimer = 0; } else if (gameState === 'HIGHSCORE' && titleTimer > 400) { gameState = 'DEMO_CHARA'; titleTimer = 0; demoEnemyIndex = 0; } else if (gameState === 'DEMO_CHARA' && titleTimer >= 180) { titleTimer = 0; demoEnemyIndex++; if (demoEnemyIndex >= ENEMY_DEMO_LIST.length) { gameState = 'TITLE'; demoEnemyIndex = 0; } }
      starfield.update(); starfield.draw(); if (map) { map.update(false); map.draw(); }
      
      if (gameState === 'TITLE') { drawCoolTitleTextOnly(); } 
      else if (gameState === 'HIGHSCORE') {
        ctx.shadowBlur = 10; ctx.shadowColor = "#ff00ff"; ctx.fillStyle = "#ffccff"; ctx.font = "bold 32px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("TOP 5 PILOTS", canvas.width / 2, 120);
        ctx.shadowBlur = 0; ctx.fillStyle = "#00ffff"; ctx.font = "bold 16px 'Courier New'"; ctx.fillText("RANK     SCORE      NAME   AREA", canvas.width / 2, 180); ctx.fillStyle = "#ffffff";
        highScores.forEach((hs, idx) => {
          let y = 230 + idx * 40, r = (idx + 1) + (idx === 0 ? "ST" : idx === 1 ? "ND" : idx === 2 ? "RD" : "TH");
          ctx.textAlign = "left"; if (idx === 0) { ctx.font = "18px 'Segoe UI'"; ctx.fillText("👑", 35, y); }
          ctx.font = "bold 16px 'Courier New'"; ctx.fillText(r.padEnd(4, " "), 60, y); ctx.fillText((hs.score || 0).toString().padStart(8, "0"), 125, y); ctx.fillText(hs.name || 'AAA', 255, y);
          let aV = hs.area || 1; let aNm = GREEK_ALPHABETS[(aV - 1) % 24] || 'UNKNOWN'; ctx.textAlign = "left"; ctx.fillText(aNm, 330, y); ctx.textAlign = "right"; ctx.fillText(aV < 10 ? " " + aV : aV.toString(), 440, y); ctx.textAlign = "left";
        });
      } else if (gameState === 'DEMO_CHARA') {
        let d = ENEMY_DEMO_LIST[demoEnemyIndex];
        ctx.shadowBlur = 10; ctx.shadowColor = "#00ffff"; ctx.fillStyle = "#00ffff"; ctx.font = "bold 28px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("TARGET DATABASE", canvas.width / 2, 110);
        let fy = 220 + Math.sin(Date.now() / 250) * 10; drawDemoEnemyGraphic(d.shape, d.color, canvas.width / 2 - 25, fy);
        ctx.shadowBlur = 15; ctx.shadowColor = d.color; ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px 'Segoe UI'"; ctx.fillText(d.name, canvas.width / 2, 330);
        ctx.shadowBlur = 0; ctx.fillStyle = "#ffcc00"; ctx.font = "bold 20px 'Segoe UI'"; ctx.fillText("SCORE : " + d.pts, canvas.width / 2, 370);
        ctx.fillStyle = "#88aacc"; ctx.font = "15px 'Segoe UI'"; ctx.fillText(d.desc, canvas.width / 2, 420);
      }
      ctx.shadowBlur = 0; ctx.fillStyle = (Math.floor(Date.now() / 500) % 2 === 0) ? "#ffffff" : "#555555"; ctx.font = "18px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText(controlMode === 'PC' ? "PRESS SPACE TO START" : "TAP SCREEN TO START", canvas.width / 2, canvas.height / 2 + 180);
      requestAnimationFrame(gameLoop); return;
    }

    if (gameState === 'NAME_ENTRY') {
      starfield.update(); starfield.draw(); if (map) map.draw();
      ctx.fillStyle = "rgba(0,5,10,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.shadowBlur = 20; ctx.shadowColor = "#00ffff"; ctx.fillStyle = "#00ffff"; ctx.font = "bold 36px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("NEW HIGH SCORE!", canvas.width / 2, 100);
      ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Segoe UI'"; ctx.fillText(controlMode === 'PC' ? "TYPE INITIALS (MAX 3 CHARS)" : "CHECKING HIGH SCORE...", canvas.width / 2, 140);
      ctx.fillStyle = "#00ffff"; ctx.font = "bold 18px 'Courier New'"; ctx.fillText("RANK     SCORE      NAME   AREA", canvas.width / 2, 200);
      let ts = [...highScores]; ts.splice(rankIndex, 0, { name: playerName, score: score, area: areaLevel, isEditing: true }); ts = ts.slice(0, 5);
      ts.forEach((hs, i) => {
        let y = 250 + i * 40, r = (i + 1) + (i === 0 ? "ST" : i === 1 ? "ND" : i === 2 ? "RD" : "TH");
        if (hs.isEditing) { ctx.shadowBlur = 15; ctx.shadowColor = "#ffcc00"; ctx.fillStyle = "#ffcc00"; } else { ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff"; }
        ctx.font = "bold 16px 'Courier New'"; ctx.textAlign = "left"; ctx.fillText(r.padEnd(4, " "), 60, y); ctx.fillText((hs.score || 0).toString().padStart(8, "0"), 125, y);
        if (hs.isEditing) { ctx.fillText(playerName + (Math.floor(Date.now() / 300) % 2 === 0 && playerName.length < 3 ? "_" : ""), 255, y); } else { ctx.fillText(hs.name || 'AAA', 255, y); }
        let aV = hs.area || 1; let aNm = GREEK_ALPHABETS[(aV - 1) % 24] || 'UNKNOWN'; ctx.textAlign = "left"; ctx.fillText(aNm, 330, y); ctx.textAlign = "right"; ctx.fillText(aV < 10 ? " " + aV : aV.toString(), 440, y); ctx.textAlign = "left";
      });
      if (controlMode === 'PC') { ctx.shadowBlur = 0; ctx.fillStyle = "#aaaaaa"; ctx.font = "16px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("TYPE AND PRESS ENTER", canvas.width / 2, 500); }
      requestAnimationFrame(gameLoop); return;
    }

    if (gameState === 'GAMEOVER') {
      starfield.draw(); if (map) map.draw();
      ctx.fillStyle = "rgba(0,5,10,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff0044"; ctx.shadowBlur = 20; ctx.shadowColor = "#ff0044"; ctx.font = "bold 46px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("MISSION FAILED", canvas.width / 2, canvas.height / 2 - 20);
      ctx.shadowBlur = 0; ctx.fillStyle = "#ffffff"; ctx.font = "20px 'Segoe UI'"; let an = GREEK_ALPHABETS[(areaLevel - 1) % 24] || 'UNKNOWN';
      ctx.fillText(an + " " + areaLevel + " / SCORE: " + score.toString().padStart(8, "0"), canvas.width / 2, canvas.height / 2 + 30);
      ctx.fillText(controlMode === 'PC' ? "F5 TO RETURN" : "TAP TO RETURN", canvas.width / 2, canvas.height / 2 + 80);
      requestAnimationFrame(gameLoop); return;
    }

    if (!isPaused) {
      gameFrames++; if (gameState !== 'INTERVAL') areaFrames++;
      
      let bp = gameState === 'BOSS_PHASE';
      let ica = (gameState === 'PLAYING') && (areaFrames >= 300 && areaFrames < 3900); 
      let iaea = ica && (areaFrames < 3780);
      
      if (gameState === 'PLAYING' && areaFrames >= 4200) { gameState = 'BOSS_PHASE'; areaBoss = new AreaBoss(); activeWaves = []; }
      
      starfield.update(bp ? 2.0 : 1.0);
      if (map) map.update(ica);
      
      if (player && player.isDestroyed) {
        if (respawnTimer > 0) {
          respawnTimer--;
          if (respawnTimer <= 0) {
            player.respawn();
          }
        }
      }

      if (player) player.update();
      if (iaea) spawnWaveFromSequence();
      
      bullets.forEach(b => b.update()); enemyBullets.forEach(eb => eb.update()); enemies.forEach(e => e.update()); items.forEach(i => i.update());
      
      if (lariosBoss) { lariosBoss.update(); if (lariosBoss.toRemove) lariosBoss = null; }
      if (areaBoss) areaBoss.update();
      explosions.forEach(ex => ex.update()); debrisList.forEach(d => d.update()); checkCollisions();
      
      if (gameState === 'INTERVAL') {
        intervalTimer--;
        if (intervalTimer <= 0) {
          areaLevel++;
          if (areaLevel > 24) {
            areaLevel = 1;
            isLooped = true;
          }
          areaFrames = 0; gameState = 'PLAYING';
          B_destroyed = 0; b_destroyed = 0; bonusMessage = ""; hiddenDestroyedThisArea = 0; lariosSpawnedThisArea = false;
          if (map) map.resetForNewArea();
        }
      }
      
      bullets = bullets.filter(b => !b.toRemove); enemyBullets = enemyBullets.filter(eb => !eb.toRemove); enemies = enemies.filter(e => !e.toRemove);
      explosions = explosions.filter(ex => !ex.dead); debrisList = debrisList.filter(d => !d.dead); items = items.filter(i => !i.toRemove);
    }
    
    starfield.draw(); if (map) map.draw(); debrisList.forEach(d => d.draw()); explosions.forEach(ex => ex.draw()); items.forEach(i => i.draw()); enemies.forEach(e => e.draw());
    if (lariosBoss) lariosBoss.draw(); if (areaBoss) areaBoss.draw(); bullets.forEach(b => b.draw()); enemyBullets.forEach(eb => eb.draw());
    if (player && gameState !== 'GAMEOVER' && gameState !== 'NAME_ENTRY' && gameState !== 'SELECT_DEVICE') player.draw();
    
    // UIスコア・エリア表示
    ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 20px "Segoe UI"'; ctx.textAlign = 'left'; ctx.fillText("SCORE " + score.toString().padStart(8, "0"), 15, 35);
    ctx.fillStyle = '#00ffff'; ctx.font = 'bold 16px "Segoe UI"'; ctx.textAlign = 'right'; let aNm = GREEK_ALPHABETS[(areaLevel - 1) % 24] || 'UNKNOWN'; ctx.fillText(aNm + " " + areaLevel, canvas.width - 15, 35); ctx.textAlign = 'left';
    
    if (player && player.isPoweredUp && !player.isDestroyed) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.fillStyle = '#00ffff'; ctx.font = 'bold 15px "Segoe UI"'; ctx.fillText("SYSTEM UPGRADE: DOUBLE LASER", 15, 60); ctx.shadowBlur = 0; }
    if (player && player.isInvincible) { ctx.fillStyle = '#ff00ff'; ctx.font = 'bold 15px "Segoe UI"'; ctx.fillText("INVINCIBLE MODE", 15, 80); }
    if (spawnModifier < 1.0) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ffaa'; ctx.fillStyle = '#00ffaa'; ctx.font = 'bold 15px "Segoe UI"'; let dp = Math.round((1 - spawnModifier) * 100); let dy = (player && player.isPoweredUp) ? 80 : 60; if (player && player.isInvincible) dy += 20; ctx.fillText(`THREAT LEVEL -${dp}%`, 15, dy); ctx.shadowBlur = 0; }
    
    // 残機アイコン描画（左下）
    if (gameState === 'PLAYING' || gameState === 'BOSS_PHASE') {
      let iconStartX = 20, iconY = canvas.height - 30;
      for (let i = 0; i < lives; i++) {
        drawMiniPlayerIcon(iconStartX + i * 22, iconY);
      }
    }

    // モバイル時ポーズボタン（右下）
    if (controlMode === 'MOBILE' && (gameState === 'PLAYING' || gameState === 'BOSS_PHASE')) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.2)"; ctx.beginPath(); ctx.arc(canvas.width - 40, canvas.height - 40, 25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; ctx.fillRect(canvas.width - 48, canvas.height - 50, 6, 20); ctx.fillRect(canvas.width - 36, canvas.height - 50, 6, 20);
    }

    // 1UPスライドアニメーション表示
    if (extendAnimState !== 'OFF') {
      if (!isPaused) {
        let centerX = canvas.width / 2;
        if (extendAnimState === 'IN') {
          extendTextX -= 12;
          if (extendTextX <= centerX) {
            extendTextX = centerX;
            extendAnimState = 'HOLD';
            extendAnimFrame = 120;
          }
        } else if (extendAnimState === 'HOLD') {
          extendAnimFrame--;
          if (extendAnimFrame <= 0) {
            extendAnimState = 'OUT';
          }
        } else if (extendAnimState === 'OUT') {
          extendTextX -= 12;
          if (extendTextX < -100) {
            extendAnimState = 'OFF';
          }
        }
      }

      ctx.save(); 
      ctx.shadowBlur = 20; ctx.shadowColor = '#ffcc00'; ctx.fillStyle = '#ffff00'; 
      ctx.font = 'bold 38px "Segoe UI"'; ctx.textAlign = 'center';
      ctx.fillText("1UP !", extendTextX, canvas.height / 2 - 50); 
      ctx.restore();
    }

    let isi = (gameState === 'PLAYING') && (areaFrames < 300);
    let sw = (gameState === 'PLAYING') && (areaFrames >= 3900 && areaFrames < 4200);

    if (isi) { ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#00ffaa' : '#005533'; ctx.font = 'bold 24px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(`${aNm} ${areaLevel} START`, canvas.width / 2, canvas.height / 2 + 100); } 
    else if (sw) { ctx.fillStyle = (Math.floor(Date.now() / 150) % 2 === 0) ? '#ff0055' : '#550011'; ctx.font = 'bold 24px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(`WARNING: AREA BOSS APPROACHING`, canvas.width / 2, 120); } 
    else if (gameState === 'INTERVAL') { ctx.fillStyle = '#00ffff'; ctx.font = 'bold 32px "Segoe UI"'; ctx.textAlign = 'center'; ctx.fillText(`${aNm} ${areaLevel} CLEARED!`, canvas.width / 2, canvas.height / 2); if (bonusMessage !== "") { ctx.fillStyle = '#ffaa00'; ctx.font = 'bold 20px "Segoe UI"'; ctx.fillText(bonusMessage, canvas.width / 2, canvas.height / 2 + 40); } }

    if (isPaused) { ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#00ffff"; ctx.font = "bold 40px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2); ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Segoe UI'"; ctx.fillText(controlMode === 'PC' ? "PRESS SPACE TO RESUME" : "TAP TO RESUME", canvas.width / 2, canvas.height / 2 + 40); }

  } catch (e) { console.error("Game Loop Exception:", e); }
  requestAnimationFrame(gameLoop);
}

// ==========================================
// 8. 初期化とゲームループ開始
// ==========================================
map = new GroundMap();
starfield = new Starfield();
requestAnimationFrame(gameLoop);
</script>
